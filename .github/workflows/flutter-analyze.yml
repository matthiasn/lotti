name: Flutter Analyze

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter Analyze on Linux
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Cache Pub Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
      - uses: kuhnroyal/flutter-fvm-config-action@4155f8ca4c30a4f2f50df69caa0e4259f6cd1142 # v2
        id: fvm-config-action
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
      - name: Run Flutter Analyze
        run: flutter analyze
      # The analyzer cannot see this one: picking `Icons.check` at a call site is
      # valid Dart. It is still the thing that let one idea wear four different
      # glyphs across the app, so it is gated here rather than left to review.
      # Ratcheted — a file's legacy-icon count may fall, never rise.
      - name: Check icon-token discipline
        run: dart run tool/icons/validate.dart
      # Release notes live in changelog.d/ as one file per pull request, so the
      # three files every change used to edit at the top — CHANGELOG.md, the
      # Flathub metainfo, pubspec.yaml — are written only by a release. This
      # catches a malformed fragment while its author is still in context, and
      # a released version that landed in some of those files but not all.
      - name: Check release-note fragments
        run: dart run tool/changelog/validate.dart
      - name: Check property-test tags
        run: dart run tool/ci/check_test_tags.dart
      # A tag can be moved to different code after review; the release jobs
      # hold signing and store secrets, so every action names its commit.
      - name: Check GitHub Actions are pinned to commits
        run: dart run tool/ci/check_action_pins.dart
      # gen-l10n does not fail on an untranslated key — it falls back to
      # English and lists the key in a gitignored file nobody reads, which is
      # how five catalogs fell 121 keys behind. Every catalog holds every key.
      - name: Check ARB catalogs hold every key
        run: dart run tool/ci/check_arb_parity.dart
      # An ADR's number is its identity — code and concepts cite "ADR 0115" —
      # and concurrent pull requests both take the next free one. Push-only, so
      # it fires once both are in one tree (a rebased branch, or main).
      - name: Check ADR numbers are unique
        run: dart run tool/ci/check_adr_numbers.dart
      # getIt belongs to the composition root. Outside it, a lookup is a hidden
      # dependency no ProviderScope override can reach. Ratcheted — a file's
      # count may fall, never rise, and a new file starts at zero.
      - name: Check getIt stays in the composition root
        run: dart run tool/di/validate.dart
      # DomainLogger is the reviewed channel; dart:developer beside it is how
      # prompts and model output reached logs. Ratcheted per file, outside
      # lib/services/ where logging itself is implemented.
      - name: Check dart:developer logging only shrinks
        run: dart run tool/logging/validate.dart
      # Spacing, typography and colour come from the design-system tokens.
      # Ratcheted like the icon check: a file's raw-value count per category
      # may fall, never rise; the token definitions themselves are exempt.
      - name: Check design-token discipline
        run: dart run tool/design_tokens/validate.dart
      # Every import in lib/ follows the layer order in
      # tool/architecture/layer_guard.dart; the imports that already break it
      # are baselined, and the baseline may only shrink.
      - name: Check imports follow the layer order
        run: dart run tool/architecture/validate.dart
