name: Flutter Matrix Integration Test

on:
  schedule:
    - cron: '43 3 * * 2'
  workflow_dispatch:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "10"

jobs:
  # Decides which integration suites a push has to run. Scheduled and manual
  # runs skip the filter and run everything. Every gated job below also runs
  # when this job fails, so a broken filter costs CI time rather than coverage.
  # None of these checks is a required status check; a skipped job still
  # reports as success, so gating by `if:` keeps the check names stable.
  changes:
    name: Detect changed paths
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
      sync: ${{ steps.filter.outputs.sync }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
      # On a feature branch the diff runs against the merge-base with the
      # default branch, i.e. the whole branch rather than only the last push.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            # Anything every integration suite depends on: toolchain,
            # dependencies, the Linux runner the tests execute in, the shared
            # models/services/utilities and dependency wiring, and this file.
            core: &core
              - '.github/workflows/flutter-matrix-test.yml'
              - '.fvmrc'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'build.yaml'
              - 'third_party/**'
              - 'linux/**'
              - 'lib/get_it*.dart'
              - 'lib/classes/**'
              - 'lib/services/**'
              - 'lib/utils/**'
            # Drift databases and the persistence layer, the journal flow the
            # persistence test drives through the app shell, and the tutorial
            # harness that boots that app on real databases, with the test
            # fixtures it imports.
            database: &database
              - *core
              - 'lib/database/**'
              - 'lib/features/*/database/**'
              - 'lib/logic/**'
              - 'lib/providers/**'
              - 'test/database/**'
              - 'lib/features/journal/**'
              - 'test/features/journal/**'
              - 'lib/beamer/**'
              - 'lib/features/ai/repository/**'
              - 'lib/features/tasks/state/saved_filters/**'
              - 'lib/features/user_activity/**'
              - 'integration_test/home_integration_test.dart'
              - 'integration_test/tutorial/tutorial_harness.dart'
              - 'test/helpers/fallbacks.dart'
              - 'test/helpers/manual_demo_world.dart'
              - 'test/mocks/mocks.dart'
            # Sync sits on top of the database layer, so it includes all of
            # it, plus the sync features and what the Matrix harness imports.
            sync:
              - *database
              - 'lib/features/sync/**'
              - 'lib/features/*/sync/**'
              - 'test/features/sync/**'
              - 'test/features/*/sync/**'
              - 'test/vector_clock*_test.dart'
              - 'test/test_resources/test_audio_data.dart'
              - 'test/utils/utils.dart'
              - 'integration_test/matrix_service_test.dart'
              - 'integration_test/matrix_test_room.dart'
              - 'integration_test/sync_resilience_test.dart'
              - 'integration_test/helpers/**'
              - 'integration_test/docker/**'
              - 'integration_test/*.sh'

  test:
    name: Matrix Test on Linux
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'push'
      || needs.changes.result != 'success'
      || needs.changes.outputs.sync == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install libraries
        run: sudo apt-get install -y --no-install-recommends libgtk-3-dev cmake libolm3 cmake-doc ninja-build libsecret-1-dev libjsoncpp-dev libsecret-1-0 sqlite3 libsqlite3-dev keybinder-3.0 network-manager mpv libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-matrix-cargo-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-matrix-cargo-
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          pub-cache: false
      - name: Get Flutter dependencies
        run: flutter pub get --offline --enforce-lockfile || flutter pub get --enforce-lockfile
      - uses: hoverkraft-tech/compose-action@v2.0.0
        with:
          cwd: "integration_test/docker"
      - name: Run Matrix integration tests
        uses: GabrielBB/xvfb-action@v1.6
        env:
          SLOW_NETWORK: false
        with:
          working-directory: ./integration_test
          run: |
            chmod +x ./setup_toxiproxy_docker.sh ./run_matrix_tests.sh
            ./setup_toxiproxy_docker.sh
            ./run_matrix_tests.sh --no-pub

  test_degraded_network:
    name: Matrix Test on Linux with degraded network
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'push'
      || needs.changes.result != 'success'
      || needs.changes.outputs.sync == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install libraries
        run: sudo apt-get install -y --no-install-recommends libgtk-3-dev cmake libolm3 cmake-doc ninja-build libsecret-1-dev libjsoncpp-dev libsecret-1-0 sqlite3 libsqlite3-dev keybinder-3.0 network-manager mpv libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-matrix-cargo-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-matrix-cargo-
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          pub-cache: false
      - name: Get Flutter dependencies
        run: flutter pub get --offline --enforce-lockfile || flutter pub get --enforce-lockfile
      - uses: hoverkraft-tech/compose-action@v2.0.0
        with:
          cwd: "integration_test/docker"
      - name: Run Matrix integration tests (degraded)
        uses: GabrielBB/xvfb-action@v1.6
        env:
          SLOW_NETWORK: true
        with:
          working-directory: ./integration_test
          run: |
            chmod +x ./setup_toxiproxy_docker.sh ./run_matrix_tests.sh
            ./setup_toxiproxy_docker.sh
            ./run_matrix_tests.sh --no-pub

  resilience:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Matrix Resilience on Linux
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install libraries
        run: sudo apt-get install -y --no-install-recommends libgtk-3-dev cmake libolm3 cmake-doc ninja-build libsecret-1-dev libjsoncpp-dev libsecret-1-0 sqlite3 libsqlite3-dev keybinder-3.0 network-manager mpv libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-matrix-cargo-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-matrix-cargo-
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          pub-cache: false
      - name: Get Flutter dependencies
        run: flutter pub get --offline --enforce-lockfile || flutter pub get --enforce-lockfile
      - uses: hoverkraft-tech/compose-action@v2.0.0
        with:
          cwd: "integration_test/docker"
      - name: Run sync resilience tests
        uses: GabrielBB/xvfb-action@v1.6
        env:
          SLOW_NETWORK: false
        with:
          working-directory: ./integration_test
          run: |
            chmod +x ./setup_toxiproxy_docker.sh ./run_resilience_tests.sh
            mkdir -p ../reports
            ./setup_toxiproxy_docker.sh
            ./run_resilience_tests.sh --no-pub --file-reporter=json:reports/resilience.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resilience-results
          path: reports/
          retention-days: 14

  home:
    name: Journal Persistence on Linux
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'push'
      || needs.changes.result != 'success'
      || needs.changes.outputs.database == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install libraries
        run: sudo apt-get install -y --no-install-recommends libgtk-3-dev cmake libolm3 cmake-doc ninja-build libsecret-1-dev libjsoncpp-dev libsecret-1-0 sqlite3 libsqlite3-dev keybinder-3.0 network-manager mpv libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-matrix-cargo-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-matrix-cargo-
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          pub-cache: false
      - name: Get Flutter dependencies
        run: flutter pub get --offline --enforce-lockfile || flutter pub get --enforce-lockfile
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Run note persistence integration test
        uses: GabrielBB/xvfb-action@v1.6
        with:
          run: flutter test integration_test/home_integration_test.dart --no-pub --file-reporter=json:reports/home.json
      - name: Summarize integration results
        if: always()
        run: dart run test/tool/analyze_test_timings.dart reports/home.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-integration-results
          path: reports/
          retention-days: 14
