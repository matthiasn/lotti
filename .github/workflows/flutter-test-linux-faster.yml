name: Flutter Tests (Unit + Glados Property)

on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Ordering seed to replay (0 keeps declaration order)'
        required: false
        default: '0'
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

env:
  TEST_ORDER_SEED: ${{ github.event_name == 'schedule' && github.run_number || inputs.seed || '0' }}

jobs:
  test:
    name: Unit & Widget Tests (Linux, shard ${{ matrix.shard_label }}/10)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
          - shard_index: 3
            shard_label: 4
          - shard_index: 4
            shard_label: 5
          - shard_index: 5
            shard_label: 6
          - shard_index: 6
            shard_label: 7
          - shard_index: 7
            shard_label: 8
          - shard_index: 8
            shard_label: 9
          - shard_index: 9
            shard_label: 10
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Cache native build hooks
        uses: actions/cache@v4
        with:
          # flutter_scene writes generated shaders into its package directory
          # as well as hook output directories; restore them together.
          path: |
            .dart_tool/hooks_runner
            ~/.pub-cache/hosted/pub.dev/flutter_scene-*
          key: ${{ runner.os }}-${{ runner.arch }}-test-hooks-v1-${{ hashFiles('.fvmrc', 'pubspec.yaml', 'pubspec.lock') }}
      - name: Run Flutter tests (standard)
        run: |
          mkdir -p reports
          echo "Ordering seed: $TEST_ORDER_SEED" | tee reports/seed.txt
          dart ${{ matrix.shard_index == 0 && '--verbose' || '' }} run tool/ci/run_tests.dart \
            ${{ matrix.shard_index == 0 && '--verbose' || '' }} \
            --coverage \
            --exclude-tags 'glados || performance || eval-live' \
            --total-shards=10 \
            --shard-index=${{ matrix.shard_index }} \
            --test-randomize-ordering-seed="$TEST_ORDER_SEED" \
            --file-reporter=json:reports/tests.json \
            --no-pub
      - name: Summarize test results
        if: always()
        run: dart run test/tool/analyze_test_timings.dart reports/tests.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-shard-${{ matrix.shard_label }}-results
          path: reports/
          retention-days: 14
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: matthiasn/lotti
          version: v11.2.8
          fail_ci_if_error: true
          flags: standard
          name: standard-shard-${{ matrix.shard_label }}
          files: coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-standard-${{ matrix.shard_label }}
          path: coverage/lcov.info
          retention-days: 1

  glados:
    name: Glados Property Tests (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Cache native build hooks
        uses: actions/cache@v4
        with:
          # flutter_scene writes generated shaders into its package directory
          # as well as hook output directories; restore them together.
          path: |
            .dart_tool/hooks_runner
            ~/.pub-cache/hosted/pub.dev/flutter_scene-*
          key: ${{ runner.os }}-${{ runner.arch }}-test-hooks-v1-${{ hashFiles('.fvmrc', 'pubspec.yaml', 'pubspec.lock') }}
      - name: Run Flutter tests (glados)
        run: |
          mkdir -p reports
          echo "Ordering seed: $TEST_ORDER_SEED" | tee reports/seed.txt
          dart run tool/ci/run_tests.dart --coverage --tags glados --no-pub \
            --exclude-tags 'eval-live' \
            --test-randomize-ordering-seed="$TEST_ORDER_SEED" \
            --file-reporter=json:reports/tests.json
      - name: Summarize test results
        if: always()
        run: dart run test/tool/analyze_test_timings.dart reports/tests.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glados-results
          path: reports/
          retention-days: 14
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: matthiasn/lotti
          version: v11.2.8
          fail_ci_if_error: true
          flags: glados
          files: coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-glados
          path: coverage/lcov.info
          retention-days: 1

  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Performance Budgets (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Cache native build hooks
        uses: actions/cache@v4
        with:
          # flutter_scene writes generated shaders into its package directory
          # as well as hook output directories; restore them together.
          path: |
            .dart_tool/hooks_runner
            ~/.pub-cache/hosted/pub.dev/flutter_scene-*
          key: ${{ runner.os }}-${{ runner.arch }}-test-hooks-v1-${{ hashFiles('.fvmrc', 'pubspec.yaml', 'pubspec.lock') }}
      - name: Run Flutter tests (performance)
        run: |
          mkdir -p reports
          echo "Ordering seed: $TEST_ORDER_SEED" | tee reports/seed.txt
          dart run tool/ci/run_tests.dart --tags performance --no-pub \
            --exclude-tags 'eval-live' \
            --test-randomize-ordering-seed="$TEST_ORDER_SEED" \
            --file-reporter=json:reports/tests.json
      - name: Summarize test results
        if: always()
        run: dart run test/tool/analyze_test_timings.dart reports/tests.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: reports/
          retention-days: 14

  codecov:
    name: Publish Codecov Status
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - test
      - glados
    steps:
      - uses: actions/checkout@v5
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: matthiasn/lotti
          version: v11.2.8
          fail_ci_if_error: true
          run_command: send-notifications

  codescene-coverage:
    name: Upload Coverage to CodeScene
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - test
      - glados
    env:
      CS_ACCESS_TOKEN_AVAILABLE: ${{ secrets.CS_ACCESS_TOKEN != '' }}
    steps:
      # cs-coverage keys the upload to the checked-out commit, so it must run
      # from the repository root of this exact revision.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        if: env.CS_ACCESS_TOKEN_AVAILABLE == 'true'
        with:
          pattern: coverage-*
          path: coverage-reports
      # CodeScene never merges one file's coverage across uploads (the latest
      # upload wins), so the eleven reports become one before a single upload.
      # Flutter emits line data only (DA records), hence line-coverage alone.
      - name: Merge coverage reports
        if: env.CS_ACCESS_TOKEN_AVAILABLE == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov
          args=()
          for report in coverage-reports/*/lcov.info; do
            args+=(--add-tracefile "$report")
          done
          mkdir -p coverage
          lcov "${args[@]}" --output-file coverage/lcov.info
      - name: Install CodeScene coverage CLI
        if: env.CS_ACCESS_TOKEN_AVAILABLE == 'true'
        run: |
          curl -fsSL https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh | bash -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Upload coverage to CodeScene
        if: env.CS_ACCESS_TOKEN_AVAILABLE == 'true'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: cs-coverage upload --format "lcov" --metric "line-coverage" coverage/lcov.info
