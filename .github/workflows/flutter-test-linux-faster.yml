name: Flutter Tests (Unit + Glados Property)

on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Ordering seed to replay (0 keeps declaration order)'
        required: false
        default: '0'
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

env:
  TEST_ORDER_SEED: ${{ github.event_name == 'schedule' && github.run_number || inputs.seed || '0' }}

jobs:
  test:
    name: Unit & Widget Tests (Linux, shard ${{ matrix.shard_label }}/10)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
          - shard_index: 3
            shard_label: 4
          - shard_index: 4
            shard_label: 5
          - shard_index: 5
            shard_label: 6
          - shard_index: 6
            shard_label: 7
          - shard_index: 7
            shard_label: 8
          - shard_index: 8
            shard_label: 9
          - shard_index: 9
            shard_label: 10
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run Flutter tests (standard)
        run: |
          mkdir -p reports
          echo "Ordering seed: $TEST_ORDER_SEED" | tee reports/seed.txt
          dart run tool/ci/run_tests.dart \
            --coverage \
            --exclude-tags 'glados || performance' \
            --total-shards=10 \
            --shard-index=${{ matrix.shard_index }} \
            --test-randomize-ordering-seed="$TEST_ORDER_SEED" \
            --file-reporter=json:reports/tests.json \
            --no-pub
      - name: Summarize test results
        if: always()
        run: dart run test/tool/analyze_test_timings.dart reports/tests.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-shard-${{ matrix.shard_label }}-results
          path: reports/
          retention-days: 14
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: matthiasn/lotti
          version: v11.2.8
          fail_ci_if_error: true
          flags: standard
          name: standard-shard-${{ matrix.shard_label }}
          files: coverage/lcov.info

  glados:
    name: Glados Property Tests (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run Flutter tests (glados)
        run: |
          mkdir -p reports
          echo "Ordering seed: $TEST_ORDER_SEED" | tee reports/seed.txt
          dart run tool/ci/run_tests.dart --coverage --tags glados --no-pub \
            --test-randomize-ordering-seed="$TEST_ORDER_SEED" \
            --file-reporter=json:reports/tests.json
      - name: Summarize test results
        if: always()
        run: dart run test/tool/analyze_test_timings.dart reports/tests.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glados-results
          path: reports/
          retention-days: 14
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: matthiasn/lotti
          version: v11.2.8
          fail_ci_if_error: true
          flags: glados
          files: coverage/lcov.info

  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Performance Budgets (Linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run Flutter tests (performance)
        run: |
          mkdir -p reports
          echo "Ordering seed: $TEST_ORDER_SEED" | tee reports/seed.txt
          dart run tool/ci/run_tests.dart --tags performance --no-pub \
            --test-randomize-ordering-seed="$TEST_ORDER_SEED" \
            --file-reporter=json:reports/tests.json
      - name: Summarize test results
        if: always()
        run: dart run test/tool/analyze_test_timings.dart reports/tests.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: reports/
          retention-days: 14

  codecov:
    name: Publish Codecov Status
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - test
      - glados
    steps:
      - uses: actions/checkout@v5
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: matthiasn/lotti
          version: v11.2.8
          fail_ci_if_error: true
          run_command: send-notifications
