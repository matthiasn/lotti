name: Manual

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/manual.yml'
      - 'docs-site/**'
      - 'docs/implementation_plans/2026-07-17_automated_manual_system.md'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'test/features/settings/ui/settings_home_screenshots_test.dart'
      - 'test/features/daily_os_next/screenshot_harness.dart'
      - 'test/features/**/*_screenshots_test.dart'
      - 'test/helpers/manual_demo_world.dart'
      - 'test/helpers/manual_screenshot_locale.dart'
      - 'test/pages/create/create_measurement_dialog_screenshots_test.dart'
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual.yml'
      - 'docs-site/**'
      - 'docs/implementation_plans/2026-07-17_automated_manual_system.md'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'test/features/settings/ui/settings_home_screenshots_test.dart'
      - 'test/features/daily_os_next/screenshot_harness.dart'
      - 'test/features/**/*_screenshots_test.dart'
      - 'test/helpers/manual_demo_world.dart'
      - 'test/helpers/manual_screenshot_locale.dart'
      - 'test/pages/create/create_measurement_dialog_screenshots_test.dart'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'development or an app marketing version such as 1.0.0'
        required: true
        default: 'development'
        type: string
      capture_screenshots:
        description: 'Regenerate the registered screenshot catalog'
        required: true
        default: true
        type: boolean
      # Defaults to true so the documented one-step release dispatch
      # (version + deploy) publishes the catalog its site snapshot requires.
      # Set to false for a dry-run build that must not touch the bucket.
      publish_media:
        description: 'Upload generated media to the R2 bucket'
        required: true
        default: true
        type: boolean
      deploy:
        description: 'Publish the static build to GitHub Pages'
        required: true
        default: true
        type: boolean

concurrency:
  group: manual-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve manual version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
      locales: ${{ steps.locales.outputs.locales }}
    steps:
      - name: Validate requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.manual_version }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION:-development}"
          if [[ "$VERSION" != "development" ]] && \
             ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid manual version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A release manual builds from the app tag that shipped it. Tags
          # carry a build number (X.Y.Z+NNNN); the newest tag of the requested
          # marketing version wins. Development builds from the triggering
          # commit (empty ref = actions/checkout default).
          if [[ "$VERSION" == "development" ]]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git ls-remote --tags "$REPOSITORY_URL" \
                "refs/tags/${VERSION}" "refs/tags/${VERSION}+*" \
              | awk '{print $2}' | grep -v '\^{}$' \
              | sed 's#^refs/tags/##' | sort -V | tail -1)
            if [[ -z "$TAG" ]]; then
              echo "No app tag found for manual version ${VERSION}" >&2
              exit 1
            fi
            echo "Resolved ${VERSION} to tag ${TAG}"
            echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Lotti
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.ref }}

      # Every downstream job checks out this exact commit rather than the ref,
      # so one run's site, screenshots and snapshot marker can never describe
      # different commits — main moving mid-run, or a new build tag landing on
      # the same marketing version, would otherwise split them.
      - name: Record the commit under build
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A release builds from its tag, and the capture targets live in that
      # tag's Makefile alongside the screenshot tests they invoke. Tags cut
      # before the sharded pipeline cannot be captured this way — say so here,
      # in seconds, rather than through eleven runners each failing on a
      # missing target after twelve minutes of capture.
      - name: Verify the resolved tree supports sharded capture
        if: steps.version.outputs.version != 'development'
        env:
          MANUAL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! make -n manual_screenshots_shard MANUAL_LOCALE=en \
              >/dev/null 2>&1; then
            echo "::error::The tag resolved for ${MANUAL_VERSION} predates the" \
              "sharded screenshot pipeline and has no" \
              "'manual_screenshots_shard' target, so its catalog cannot be" \
              "captured. Publish a release manual from a tag that contains it."
            exit 1
          fi

      # The capture matrix comes from the registry, so adding a manual locale
      # cannot silently leave that locale uncaptured.
      - name: Resolve the capture locales
        id: locales
        run: |
          set -euo pipefail
          LOCALES=$(jq -c '.locales' docs-site/metadata/screenshot-cases.json)
          if [[ -z "$LOCALES" || "$LOCALES" == 'null' || "$LOCALES" == '[]' ]]; then
            echo "::error::The screenshot registry declares no locales."
            exit 1
          fi
          echo "locales=$LOCALES" >> "$GITHUB_OUTPUT"
          echo "Capture locales: $LOCALES"

  build:
    name: Validate and build
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # For a release this is the tag's commit, not the commit that triggered
      # the dispatch — the snapshot marker records what was actually built.
      - name: Checkout Lotti
        uses: actions/checkout@v5
        with:
          path: lotti
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lotti/docs-site/package-lock.json

      - name: Install locked dependencies
        working-directory: lotti/docs-site
        run: npm ci

      - name: Reject high-severity production advisories
        working-directory: lotti/docs-site
        run: npm run audit:gate

      - name: Validate, test, type-check, and build
        working-directory: lotti/docs-site
        env:
          MANUAL_VERSION: ${{ needs.metadata.outputs.version }}
          MANUAL_SITE_URL: https://${{ github.repository_owner }}.github.io
          MANUAL_ROOT_PATH: /${{ github.event.repository.name }}/manual
          MANUAL_BASE_URL: /${{ github.event.repository.name }}/manual/${{ needs.metadata.outputs.version }}/
        run: npm run check

      - name: Upload static manual
        uses: actions/upload-artifact@v4
        with:
          name: lotti-manual-${{ needs.metadata.outputs.version }}
          path: lotti/docs-site/build
          if-no-files-found: error
          retention-days: 14

      # The development site snapshot publishes straight from this job so
      # prose fixes never wait on (or break with) the capture job. Release
      # snapshots go through the publish_site job below, which is gated on
      # the release's screenshot catalog existing.
      - name: Publish development site snapshot to R2
        if: >-
          needs.metadata.outputs.version == 'development' &&
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          LOTTI_COMMIT: ${{ needs.metadata.outputs.commit }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET_NAME" || \
                -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured; skipping the" \
              "site snapshot publish. The build is still available as the" \
              "run artifact."
            exit 0
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DEST="s3://${R2_BUCKET_NAME}/manual-site/development"
          aws s3 sync lotti/docs-site/build "$DEST" \
            --endpoint-url "$ENDPOINT" \
            --exclude '.snapshot.json' --delete --no-progress
          printf '{"version":"development","appCommit":"%s","generatedAt":"%s"}\n' \
            "$LOTTI_COMMIT" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${RUNNER_TEMP}/.snapshot.json"
          aws s3 cp "${RUNNER_TEMP}/.snapshot.json" "$DEST/.snapshot.json" \
            --endpoint-url "$ENDPOINT"

  # A release's site snapshot must not land before its screenshot catalog:
  # release pages request manual/screenshots/<version>/…, so advertising the
  # version first would ship broken images. This job waits for the capture
  # job and additionally verifies the media manifest exists in the bucket —
  # capture can succeed without publishing when publish_media is off, and a
  # two-step release (capture+publish first, deploy later) is also valid.
  publish_site:
    name: Publish release site snapshot
    needs: [metadata, build, screenshot_catalog]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy &&
      needs.metadata.outputs.version != 'development' &&
      (needs.screenshot_catalog.result == 'success' ||
       needs.screenshot_catalog.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built manual
        uses: actions/download-artifact@v5
        with:
          name: lotti-manual-${{ needs.metadata.outputs.version }}
          path: site-build

      - name: Publish site snapshot to R2
        env:
          MANUAL_VERSION: ${{ needs.metadata.outputs.version }}
          LOTTI_COMMIT: ${{ needs.metadata.outputs.commit }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET_NAME" || \
                -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured; skipping the" \
              "site snapshot publish. The build is still available as the" \
              "run artifact."
            exit 0
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY_PREFIX="manual-site/${MANUAL_VERSION}"
          DEST="s3://${R2_BUCKET_NAME}/${KEY_PREFIX}"
          if aws s3api head-object --endpoint-url "$ENDPOINT" \
              --bucket "$R2_BUCKET_NAME" \
              --key "${KEY_PREFIX}/.snapshot.json" >/dev/null 2>&1; then
            echo "::error::Manual site ${MANUAL_VERSION} is already" \
              "published and immutable; refusing to overwrite it."
            exit 1
          fi
          MEDIA_KEY="manual/screenshots/${MANUAL_VERSION}/manifest.json"
          if ! aws s3 cp "s3://${R2_BUCKET_NAME}/${MEDIA_KEY}" \
              "${RUNNER_TEMP}/media-manifest.json" \
              --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "::error::No screenshot catalog is published for" \
              "${MANUAL_VERSION}; run the release dispatch with" \
              "publish_media enabled before (or while) deploying it."
            exit 1
          fi
          # The immutable media prefix may predate this build if a newer
          # build tag was added for the same marketing version. Pages from
          # one app commit must not ship with screenshots from another.
          MEDIA_COMMIT=$(jq -r '.appCommit // empty' \
            "${RUNNER_TEMP}/media-manifest.json")
          if [[ -z "$MEDIA_COMMIT" ]] || { \
              [[ "$LOTTI_COMMIT" != "$MEDIA_COMMIT"* ]] && \
              [[ "$MEDIA_COMMIT" != "$LOTTI_COMMIT"* ]]; }; then
            echo "::error::The published screenshot catalog for" \
              "${MANUAL_VERSION} was captured from" \
              "'${MEDIA_COMMIT:-unknown}' but this site build is from" \
              "'${LOTTI_COMMIT}'. Refusing to combine pages and media from" \
              "different app commits under an immutable version."
            exit 1
          fi
          aws s3 sync site-build "$DEST" \
            --endpoint-url "$ENDPOINT" \
            --exclude '.snapshot.json' --delete --no-progress
          printf '{"version":"%s","appCommit":"%s","generatedAt":"%s"}\n' \
            "$MANUAL_VERSION" "$LOTTI_COMMIT" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${RUNNER_TEMP}/.snapshot.json"
          aws s3 cp "${RUNNER_TEMP}/.snapshot.json" "$DEST/.snapshot.json" \
            --endpoint-url "$ENDPOINT"

  # One job per manual locale. A locale takes roughly twelve minutes to
  # capture, so the whole catalog needs over two hours in sequence — longer
  # than a runner should hold, and the reason this job used to be killed at
  # its timeout without ever publishing. Each shard converts its own locale to
  # WebP and leaves the manifest to `screenshot_catalog`, which sees them all.
  screenshots:
    name: Capture ${{ matrix.locale }} screenshots
    needs: metadata
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.capture_screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Report every broken locale in one run: a capture that only fails in,
      # say, German is exactly the kind of defect a cancelled matrix hides.
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.metadata.outputs.locales) }}
    steps:
      # A release captures from its resolved app tag, so the immutable media
      # prefix shows the UI that release actually shipped — not current main.
      - name: Checkout Lotti
        uses: actions/checkout@v5
        with:
          path: lotti
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lotti/docs-site/package-lock.json

      - name: Read the pinned Flutter version
        uses: kuhnroyal/flutter-fvm-config-action@v2
        id: flutter-version
        with:
          path: lotti/.fvmrc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.flutter-version.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install Flutter dependencies
        working-directory: lotti
        run: fvm flutter pub get --enforce-lockfile

      - name: Install manual dependencies
        working-directory: lotti
        run: make manual_deps

      - name: Capture and materialize the ${{ matrix.locale }} screenshots
        working-directory: lotti
        run: >-
          make manual_screenshots_shard
          MANUAL_LOCALE="${{ matrix.locale }}"
          MANUAL_VERSION="${{ needs.metadata.outputs.version }}"
          MANUAL_MEDIA_DIR="${{ runner.temp }}/lotti-manual-media"
          MANUAL_CAPTURE_DIR="${{ runner.temp }}/lotti-manual-capture/${{ needs.metadata.outputs.version }}"

      - name: Upload the ${{ matrix.locale }} media slice
        uses: actions/upload-artifact@v4
        with:
          name: lotti-manual-media-${{ needs.metadata.outputs.version }}-${{ matrix.locale }}
          path: ${{ runner.temp }}/lotti-manual-media/${{ needs.metadata.outputs.version }}
          if-no-files-found: error
          # Purely a hand-off to the job below; the reviewable artifact is the
          # merged catalog it produces.
          retention-days: 1

  # Reassemble the sharded slices into one catalog. The manifest is written
  # here rather than in a shard because it must describe every locale, and
  # validation only means anything against the complete tree.
  screenshot_catalog:
    name: Publish screenshot catalog
    needs: [metadata, screenshots]
    if: needs.screenshots.result == 'success'
    runs-on: ubuntu-latest
    # Moves the whole catalog twice (download, then publish) and checksums
    # every file in it, so it needs more than a trivial budget.
    timeout-minutes: 45
    steps:
      - name: Checkout Lotti
        uses: actions/checkout@v5
        with:
          path: lotti
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lotti/docs-site/package-lock.json

      - name: Install manual dependencies
        working-directory: lotti
        run: make manual_deps

      # The slices are disjoint — English at the root, every other locale
      # under its own directory — so merging them cannot lose or clobber a
      # file. `--delete` on the publish below then retires anything stale.
      - name: Download every locale's media slice
        uses: actions/download-artifact@v5
        with:
          pattern: lotti-manual-media-${{ needs.metadata.outputs.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/lotti-manual-media/${{ needs.metadata.outputs.version }}

      # Fails when any registered case, locale or variant is missing, which is
      # what makes an incomplete matrix impossible to publish.
      - name: Write and validate the combined manifest
        working-directory: lotti
        env:
          LOTTI_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: >-
          make manual_screenshots_manifest
          MANUAL_VERSION="${{ needs.metadata.outputs.version }}"
          MANUAL_MEDIA_DIR="${{ runner.temp }}/lotti-manual-media"

      - name: Upload generated media for review
        uses: actions/upload-artifact@v4
        with:
          name: lotti-manual-media-${{ needs.metadata.outputs.version }}
          path: ${{ runner.temp }}/lotti-manual-media/${{ needs.metadata.outputs.version }}
          if-no-files-found: error
          retention-days: 14

      # The manual's screenshots are served from the Cloudflare R2 bucket that
      # also hosts the tutorial videos, under a versioned prefix per manual
      # version. `development` is mutable and synced with deletion so retired
      # cases disappear; release versions are immutable — publishing refuses
      # to overwrite an existing manifest.
      - name: Publish media to R2
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_media)
        env:
          MANUAL_VERSION: ${{ needs.metadata.outputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET_NAME" || \
                -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured (R2_ACCOUNT_ID," \
              "R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME);" \
              "skipping the media publish. The capture is still available" \
              "as the run artifact."
            exit 0
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          SRC="${RUNNER_TEMP}/lotti-manual-media/${MANUAL_VERSION}"
          KEY_PREFIX="manual/screenshots/${MANUAL_VERSION}"
          DEST="s3://${R2_BUCKET_NAME}/${KEY_PREFIX}"
          if [[ "$MANUAL_VERSION" != 'development' ]]; then
            if aws s3api head-object --endpoint-url "$ENDPOINT" \
                --bucket "$R2_BUCKET_NAME" \
                --key "${KEY_PREFIX}/manifest.json" >/dev/null 2>&1; then
              echo "::error::Manual version ${MANUAL_VERSION} is already" \
                "published and immutable; refusing to overwrite it."
              exit 1
            fi
          fi
          # The manifest goes up last so readers never resolve cases whose
          # media has not landed yet.
          aws s3 sync "$SRC" "$DEST" --endpoint-url "$ENDPOINT" \
            --exclude 'manifest.json' --delete --no-progress
          aws s3 cp "$SRC/manifest.json" "$DEST/manifest.json" \
            --endpoint-url "$ENDPOINT"

  # Two deploy jobs share the same steps but different prerequisites, so an
  # ordinary development push never waits behind the capture job's dependency
  # chain (a `needs` edge delays a job even when the needed job ends up
  # skipped), while a release deploy strictly follows its snapshot publish.
  # The shared github-pages concurrency group serializes them.
  deploy:
    name: Publish GitHub Pages
    needs: [metadata, build]
    if: >-
      needs.build.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy &&
        needs.metadata.outputs.version == 'development'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages tree is composed from the R2 site-snapshot store, not from
      # this run's build alone — that is what keeps every published manual
      # version selectable after any single-version deploy. The finalize
      # script is pinned to the default branch (a dispatch can target another
      # ref), so snapshots are always composed with current publishing logic.
      - name: Checkout Lotti
        uses: actions/checkout@v5
        with:
          path: lotti
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Mirror site snapshots from R2
        id: mirror
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET_NAME" || \
                -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured; skipping the" \
              "Pages deploy — there is no site-snapshot store to publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync "s3://${R2_BUCKET_NAME}/manual-site" \
            "${RUNNER_TEMP}/lotti-manual-pages/manual" \
            --endpoint-url "$ENDPOINT" --no-progress
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Finalize Pages tree
        if: steps.mirror.outputs.ready == 'true'
        env:
          PAGES_PREFIX: ${{ github.event.repository.name }}
        run: >-
          node lotti/docs-site/scripts/assemble-pages-site.mjs
          --finalize
          --output-root "${RUNNER_TEMP}/lotti-manual-pages"
          --pages-prefix "$PAGES_PREFIX"

      - name: Upload GitHub Pages artifact
        if: steps.mirror.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/lotti-manual-pages

      - name: Deploy artifact to GitHub Pages
        if: steps.mirror.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_release:
    name: Publish GitHub Pages (release)
    needs: [metadata, publish_site]
    if: >-
      always() &&
      needs.publish_site.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy &&
      needs.metadata.outputs.version != 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Lotti
        uses: actions/checkout@v5
        with:
          path: lotti
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Mirror site snapshots from R2
        id: mirror
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET_NAME" || \
                -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured; skipping the" \
              "Pages deploy — there is no site-snapshot store to publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync "s3://${R2_BUCKET_NAME}/manual-site" \
            "${RUNNER_TEMP}/lotti-manual-pages/manual" \
            --endpoint-url "$ENDPOINT" --no-progress
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Finalize Pages tree
        if: steps.mirror.outputs.ready == 'true'
        env:
          PAGES_PREFIX: ${{ github.event.repository.name }}
        run: >-
          node lotti/docs-site/scripts/assemble-pages-site.mjs
          --finalize
          --output-root "${RUNNER_TEMP}/lotti-manual-pages"
          --pages-prefix "$PAGES_PREFIX"

      - name: Upload GitHub Pages artifact
        if: steps.mirror.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/lotti-manual-pages

      - name: Deploy artifact to GitHub Pages
        if: steps.mirror.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
