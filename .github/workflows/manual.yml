name: Manual

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/manual.yml'
      - 'docs-site/**'
      - 'docs/implementation_plans/2026-07-17_automated_manual_system.md'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'test/features/settings/ui/settings_home_screenshots_test.dart'
      - 'test/features/daily_os_next/screenshot_harness.dart'
      - 'test/features/**/*_screenshots_test.dart'
      - 'test/helpers/manual_demo_world.dart'
      - 'test/helpers/manual_screenshot_locale.dart'
      - 'test/pages/create/create_measurement_dialog_screenshots_test.dart'
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual.yml'
      - 'docs-site/**'
      - 'docs/implementation_plans/2026-07-17_automated_manual_system.md'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'test/features/settings/ui/settings_home_screenshots_test.dart'
      - 'test/features/daily_os_next/screenshot_harness.dart'
      - 'test/features/**/*_screenshots_test.dart'
      - 'test/helpers/manual_demo_world.dart'
      - 'test/helpers/manual_screenshot_locale.dart'
      - 'test/pages/create/create_measurement_dialog_screenshots_test.dart'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'development or an app marketing version such as 1.0.0'
        required: true
        default: 'development'
        type: string
      capture_screenshots:
        description: 'Regenerate the registered screenshot catalog'
        required: true
        default: true
        type: boolean
      publish_media:
        description: 'Upload generated media to the R2 bucket'
        required: true
        default: false
        type: boolean
      deploy:
        description: 'Publish the static build to GitHub Pages'
        required: true
        default: true
        type: boolean

concurrency:
  group: manual-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve manual version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.manual_version }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION:-development}"
          if [[ "$VERSION" != "development" ]] && \
             ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid manual version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Validate and build
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Lotti
        uses: actions/checkout@v5
        with:
          path: lotti
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lotti/docs-site/package-lock.json

      - name: Install locked dependencies
        working-directory: lotti/docs-site
        run: npm ci

      - name: Reject high-severity production advisories
        working-directory: lotti/docs-site
        run: npm run audit:gate

      - name: Validate, test, type-check, and build
        working-directory: lotti/docs-site
        env:
          MANUAL_VERSION: ${{ needs.metadata.outputs.version }}
          MANUAL_SITE_URL: https://${{ github.repository_owner }}.github.io
          MANUAL_ROOT_PATH: /${{ github.event.repository.name }}/manual
          MANUAL_BASE_URL: /${{ github.event.repository.name }}/manual/${{ needs.metadata.outputs.version }}/
        run: npm run check

      - name: Upload static manual
        uses: actions/upload-artifact@v4
        with:
          name: lotti-manual-${{ needs.metadata.outputs.version }}
          path: lotti/docs-site/build
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy &&
           needs.metadata.outputs.version == 'development')
        uses: actions/configure-pages@v5

      - name: Assemble versioned GitHub Pages snapshot
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy &&
           needs.metadata.outputs.version == 'development')
        working-directory: lotti/docs-site
        env:
          PAGES_PREFIX: ${{ github.event.repository.name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          npm run pages:assemble --
          --build-root build
          --output-root "${RUNNER_TEMP}/lotti-manual-pages"
          --pages-prefix "$PAGES_PREFIX"
          --version "$VERSION"

      - name: Upload GitHub Pages artifact
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy &&
           needs.metadata.outputs.version == 'development')
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/lotti-manual-pages

  screenshots:
    name: Capture screenshot catalog
    needs: metadata
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.capture_screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Lotti
        uses: actions/checkout@v5
        with:
          path: lotti
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lotti/docs-site/package-lock.json

      - name: Read the pinned Flutter version
        uses: kuhnroyal/flutter-fvm-config-action@v2
        id: flutter-version
        with:
          path: lotti/.fvmrc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.flutter-version.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install Flutter dependencies
        working-directory: lotti
        run: fvm flutter pub get --enforce-lockfile

      - name: Capture and materialize registered screenshots
        working-directory: lotti
        run: >-
          make manual_screenshots
          MANUAL_VERSION="${{ needs.metadata.outputs.version }}"
          MANUAL_MEDIA_DIR="${{ runner.temp }}/lotti-manual-media"
          MANUAL_CAPTURE_DIR="${{ runner.temp }}/lotti-manual-capture/${{ needs.metadata.outputs.version }}"

      - name: Upload generated media for review
        uses: actions/upload-artifact@v4
        with:
          name: lotti-manual-media-${{ needs.metadata.outputs.version }}
          path: ${{ runner.temp }}/lotti-manual-media/${{ needs.metadata.outputs.version }}
          if-no-files-found: error
          retention-days: 14

      # The manual's screenshots are served from the Cloudflare R2 bucket that
      # also hosts the tutorial videos, under a versioned prefix per manual
      # version. `development` is mutable and synced with deletion so retired
      # cases disappear; release versions are immutable — publishing refuses
      # to overwrite an existing manifest.
      - name: Publish media to R2
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_media)
        env:
          MANUAL_VERSION: ${{ needs.metadata.outputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET_NAME" || \
                -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured (R2_ACCOUNT_ID," \
              "R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME);" \
              "skipping the media publish. The capture is still available" \
              "as the run artifact."
            exit 0
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          SRC="${RUNNER_TEMP}/lotti-manual-media/${MANUAL_VERSION}"
          KEY_PREFIX="manual/screenshots/${MANUAL_VERSION}"
          DEST="s3://${R2_BUCKET_NAME}/${KEY_PREFIX}"
          if [[ "$MANUAL_VERSION" != 'development' ]]; then
            if aws s3api head-object --endpoint-url "$ENDPOINT" \
                --bucket "$R2_BUCKET_NAME" \
                --key "${KEY_PREFIX}/manifest.json" >/dev/null 2>&1; then
              echo "::error::Manual version ${MANUAL_VERSION} is already" \
                "published and immutable; refusing to overwrite it."
              exit 1
            fi
          fi
          # The manifest goes up last so readers never resolve cases whose
          # media has not landed yet.
          aws s3 sync "$SRC" "$DEST" --endpoint-url "$ENDPOINT" \
            --exclude 'manifest.json' --delete --no-progress
          aws s3 cp "$SRC/manifest.json" "$DEST/manifest.json" \
            --endpoint-url "$ENDPOINT"

  deploy:
    name: Publish GitHub Pages
    needs: [metadata, build]
    if: >-
      needs.build.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy &&
        needs.metadata.outputs.version == 'development'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
