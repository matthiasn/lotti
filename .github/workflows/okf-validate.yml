name: Knowledge Bundle

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OKF bundle
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Cache Pub Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
      - uses: kuhnroyal/flutter-fvm-config-action@4155f8ca4c30a4f2f50df69caa0e4259f6cd1142 # v2
        id: fvm-config-action
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Fails when a concept's frontmatter is malformed or when it points at a
      # file that no longer exists — the signal that the documented
      # architecture has drifted from the code.
      - name: Validate knowledge bundle
        run: dart run tool/okf/validate.dart knowledge

  mermaid:
    name: Parse mermaid diagrams
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tool/okf/package-lock.json
      # The Dart validator cannot parse mermaid — there is no Dart parser — so a
      # diagram that renders as an error box is invisible to `make okf_check`.
      # Three shipped that way. This runs mermaid itself under jsdom over both
      # knowledge/ and docs/: every tree left ungated accumulated broken
      # diagrams, so the gate now covers anything a reader might open.
      - name: Install check dependencies
        run: npm ci
        working-directory: tool/okf
      # The gate's own tests: fence forms, nesting, and the semicolon split that
      # parses clean while rendering phantom nodes.
      - name: Test the mermaid checker
        run: npm test
        working-directory: tool/okf
      - name: Parse every mermaid block
        run: npm run check
        working-directory: tool/okf
