      - "lib/features/agents/workflow/task_tool_dispatcher.dart"
      - "lib/features/agents/workflow/task_tool_handlers.dart"
      - "lib/features/agents/workflow/event_tool_dispatcher.dart"
      - "lib/features/ai/functions/lotti_batch_checklist_handler.dart"
      - "lib/features/tasks/repository/checklist_repository.dart"
      - "lib/database/database_entity_ops.dart"
      - "lib/features/agents/sync/agent_concurrent_resolver.dart"
      - "lib/features/agents/state/agent_providers.dart"
      - "lib/features/goals/runtime/goal_agent_phase_a.dart"
      - "lib/features/goals/service/goal_chat_service.dart"
      - "lib/features/goals/state/goal_agent_providers.dart"
      - "lib/features/relationships/runtime/relationship_agent_phase_a.dart"
      - "lib/classes/goal_trigger_tokens.dart"
      - "lib/features/sync/matrix/sync_event_processor_agent_handlers.dart"
      - "lib/features/agents/sync/agent_lww_timestamp.dart"
      - "lib/features/daily_os_next/agents/service/day_agent_service.dart"
      - "lib/features/daily_os_next/services/day_agent_job_executor.dart"
      - "lib/features/daily_os_next/services/day_processing_outbox_repository.dart"
      - "lib/features/daily_os_next/services/day_processing_outbox_processor.dart"
      - "lib/features/daily_os_next/services/day_processing_runtime.dart"
      - "lib/features/daily_os_next/state/day_agent_job_wiring.dart"
      - "lib/features/agents/sync/agent_sync_service.dart"
      - "lib/features/sync/matrix/sync_event_processor_agent_handlers.dart"
      - "lib/features/agents/workflow/wake_output_writer.dart"
      - "lib/features/agents/workflow/task_agent_execute.dart"
      - "lib/features/agents/workflow/project_agent_workflow.dart"
      - "lib/features/daily_os_next/agents/workflow/day_agent_workflow.dart"
      - "lib/features/daily_os_next/agents/workflow/day_agent_tool_handlers.dart"
      - "lib/features/sync/matrix/sync_event_processor.dart"
      - "lib/features/agents/service/soul_version_ops.dart"
      - "lib/features/agents/service/agent_template_crud.dart"
      - "lib/features/goals/service/goal_spec_revision_service.dart"
      - "lib/features/goals/runtime/goal_agent_phase_a.dart"
      - "lib/features/goals/workflow/goal_agent_workflow.dart"
      - "lib/features/relationships/workflow/relationship_agent_workflow.dart"
      - "lib/features/agents/workflow/event_agent_workflow.dart"
      - "lib/features/agents/workflow/project_agent_execute.dart"
      - "lib/features/agents/sync/fork_healer.dart"
      - "lib/features/agents/sync/agent_log_compactor.dart"
      - "lib/features/agents/sync/agent_message_dag.dart"
      - "lib/features/agents/projection/join_plan.dart"
      - "lib/features/agents/projection/canonical_order.dart"
      - "lib/features/agents/projection/agent_projection.dart"
      - "lib/features/agents/projection/compaction_summary.dart"
      - "lib/features/agents/projection/compaction_plan.dart"
      - "lib/features/agents/projection/input_events.dart"
      - ".github/workflows/tla-model-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configurations:
    name: Discover TLC configurations
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      configurations: ${{ steps.discover.outputs.configurations }}
    steps:
      - uses: actions/checkout@v5
      - id: discover
        name: Discover every checked-in configuration
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          configurations = sorted(path.stem for path in Path("specs/tla").glob("*.cfg"))
          if not configurations:
              raise SystemExit("No TLC configurations found")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"configurations={json.dumps(configurations)}\n")
          PY

  model-check:
    name: TLC (${{ matrix.configuration }})
    needs: configurations
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.configurations.outputs.configurations) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # tlc.sh downloads and checksum-verifies the pinned tla2tools.jar.
      - name: Cache TLA+ tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/lotti-tla
          key: tla2tools-${{ hashFiles('specs/tla/tlc.sh') }}
      - name: Model-check configuration
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: specs/tla/tlc.sh "$CONFIGURATION"

  tlc:
    # Keep the stable aggregate check for branch protection. A failed,
    # cancelled or skipped shard must never turn this check green.
    name: TLC
    if: always()
    needs: [configurations, model-check]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every configuration to pass
        env:
          DISCOVERY_RESULT: ${{ needs.configurations.result }}
          MODEL_CHECK_RESULT: ${{ needs.model-check.result }}
        run: |
          test "$DISCOVERY_RESULT" = success
          test "$MODEL_CHECK_RESULT" = success
