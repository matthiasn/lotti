concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configurations:
    name: Plan TLC shards
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      # Every checked-in configuration lands in exactly one shard; measured
      # runtimes in shards.py only balance them.
      - id: plan
        name: Pack every checked-in configuration into shards
        run: |
          python3 specs/tla/shards.py --table
          echo "shards=$(python3 specs/tla/shards.py)" >> "$GITHUB_OUTPUT"

  model-check:
    name: TLC shard ${{ matrix.shard }}
    needs: configurations
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configurations.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # tlc.sh downloads and checksum-verifies the pinned tla2tools.jar.
      - name: Cache TLA+ tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/lotti-tla
          key: tla2tools-${{ hashFiles('specs/tla/tlc.sh') }}
      # Check every configuration in the shard even after one fails, so a
      # single run reports all failing configurations, not only the first.
      - name: Model-check the shard's configurations
        env:
          CONFIGURATIONS: ${{ matrix.configurations }}
        run: |
          failed=()
          echo "| Configuration | Result | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          for configuration in $CONFIGURATIONS; do
            echo "::group::TLC $configuration"
            started=$SECONDS
            if specs/tla/tlc.sh "$configuration"; then
              result=pass
            else
              result=FAIL
              failed+=("$configuration")
            fi
            echo "::endgroup::"
            echo "| \`$configuration\` | $result | $((SECONDS - started)) |" >> "$GITHUB_STEP_SUMMARY"
            if [[ $result == FAIL ]]; then
              echo "::error title=TLC::$configuration failed"
            fi
          done
          if (( ${#failed[@]} )); then
            echo "Failed: ${failed[*]}" >&2
            exit 1
          fi

  tlc:
    # Keep the stable aggregate check for branch protection. A failed,
    # cancelled or skipped shard must never turn this check green.
    name: TLC
    if: always()
    needs: [configurations, model-check]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to pass
        env:
          DISCOVERY_RESULT: ${{ needs.configurations.result }}
          MODEL_CHECK_RESULT: ${{ needs.model-check.result }}
        run: |
          test "$DISCOVERY_RESULT" = success
          test "$MODEL_CHECK_RESULT" = success
