name: TLA+ Model Check

# Model-checks the formal specs under specs/tla with TLC. Runs when a spec or
# the code it models changes; the spec is only worth having while it keeps
# describing that code.
on:
  push:
    branches: ["**"]
    paths:
      - "specs/tla/**"
      - "lib/features/sync/sequence/**"
      - "lib/features/sync/backfill/**"
      - "lib/features/sync/outbox/**"
      - "lib/database/sync_db_sequence.dart"
      - "lib/database/sync_db_watermarks.dart"
      - "lib/features/sync/vector_clock.dart"
      - "lib/services/vector_clock_service.dart"
      - "lib/logic/services/metadata_service.dart"
      - "lib/logic/persistence_create_ops.dart"
      - "lib/features/relationships/repository/relationship_repository.dart"
      - "lib/features/agents/wake/**"
      - "lib/features/agents/service/change_set_confirmation_service.dart"
      - "lib/features/agents/service/change_set_resolution_store.dart"
      - "lib/features/agents/service/suggestion_retraction_service.dart"
      - "lib/features/agents/workflow/change_set_builder.dart"
      - "lib/features/agents/workflow/change_item_dedup.dart"
      - "lib/features/agents/model/change_set.dart"
      - "lib/features/agents/tools/change_effect.dart"
      - "lib/features/agents/tools/follow_up_task_handler.dart"
      - "lib/features/agents/tools/time_entry_handler.dart"
