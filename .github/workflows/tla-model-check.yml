name: TLA+ Model Check

# Model-checks the formal specs under specs/tla with TLC. Runs when a spec or
# the code it models changes; the spec is only worth having while it keeps
# describing that code.
on:
  push:
    branches: ["**"]
    paths:
      - "specs/tla/**"
      - "lib/features/sync/sequence/**"
      - "lib/features/sync/backfill/**"
      - "lib/features/sync/outbox/**"
      - "lib/database/sync_db_sequence.dart"
      - "lib/services/vector_clock_service.dart"
      - "lib/features/agents/wake/**"
      - "lib/features/agents/service/change_set_confirmation_service.dart"
      - "lib/features/agents/service/change_set_resolution_store.dart"
      - ".github/workflows/tla-model-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # tlc.sh downloads and checksum-verifies the pinned tla2tools.jar.
      - name: Cache TLA+ tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/lotti-tla
          key: tla2tools-${{ hashFiles('specs/tla/tlc.sh') }}
      - name: Model-check every configuration
        run: specs/tla/tlc.sh
