workflows:
  windows-release:
    name: Windows Release
    instance_type: windows_x2
    max_build_duration: 90
    environment:
      # `fvm` makes Codemagic read the version from .fvmrc — the same pin the
      # GitHub Actions lanes read — so this file needs no edit on a Flutter
      # bump. Codemagic fails the build if .fvmrc is missing. A literal
      # version here silently rots: it sat at 3.41.4 (Dart 3.11.1) long after
      # the SDK floor moved to 3.12.0, and every Windows release failed in
      # `pub get` with a version-solving error.
      flutter: fvm
      groups:
        - windows_signing
    # No `triggering` block on purpose: the Windows build used to fan out from
    # every release tag (`*.*.*+*`) like the GitHub lanes do, but the
    # windows_x2 minutes made it the most expensive lane per release. It is
    # manual-only for now — start it from the Codemagic UI (Start new build →
    # Windows Release, pick the release tag) or the builds API. Reinstate a
    # `triggering: events: [tag]` block with that pattern to put it back on
    # automatic.
    scripts:
      - name: Show toolchain versions
        script: |
          flutter --version
          dart --version

      - name: Install Rust toolchain (required by flutter_vodozemac/cargokit)
        script: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable --profile minimal
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          Add-Content -Path $env:CM_ENV -Value "PATH+=$cargoBin"
          & "$cargoBin\rustc.exe" --version
          & "$cargoBin\cargo.exe" --version

      - name: Flutter pub get
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Build Windows release
        script: flutter build windows --release

      - name: Decode signing certificate
        script: |
          $ErrorActionPreference = "Stop"
          $pfxPath = "$env:CM_BUILD_DIR\lotti.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          Add-Content -Path $env:CM_ENV -Value "MSIX_CERTIFICATE_PATH=$pfxPath"

      - name: Package MSIX
        script: |
          dart run msix:create --release `
            --certificate-path $env:MSIX_CERTIFICATE_PATH `
            --certificate-password $env:MSIX_CERTIFICATE_PASSWORD

      - name: Zip release artifacts
        script: |
          $src = "$env:CM_BUILD_DIR\build\windows\x64\runner\Release"
          $dst = "$env:CM_BUILD_DIR\lotti-windows-x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dst -Force
    artifacts:
      - build/windows/x64/runner/Release/**/*
      - lotti-windows-x64.zip
      - build/windows/**/*.msix
    publishing:
      email:
        recipients:
          - matthias.nehlsen@gmail.com
        notify:
          success: true
          failure: true
