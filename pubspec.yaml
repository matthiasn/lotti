dependency_overrides:
  # json_serializable >=6.13.2 requires analyzer >=10, while
  # objectbox_generator 5.x currently caps analyzer below 11.
  analyzer_plugin: '>=0.14.0 <0.14.5'
  # health >=13.2.0 requires device_info_plus ^12.1.0, while
  # super_native_extensions 0.9.1 still caps it below 12.0.0.
  device_info_plus: ^12.1.0
  # Local fork: runs ONNX inference off the main thread on macOS, which Flutter
  # can't do via platform-channel task queues (flutter/flutter#162613).
  # See third_party/flutter_onnxruntime/LOTTI_PATCHES.md.
  flutter_onnxruntime:
    path: third_party/flutter_onnxruntime
  # Downgrade to avoid objective_c.framework malformed bundle issue (ITMS-90291)
  # See: https://github.com/flutter/flutter/issues/178915
  path_provider_foundation: 2.5.1
  # sherpa_onnx's platform packages ship the native ONNX Runtime, and
  # `sherpa_onnx: 1.13.4` only constrains them to `^1.13.4` — which resolves to
  # 1.13.7 and reintroduces the mismatch below. Pin them exactly.
  #
  # ORT exports its C API with ELF symbol versioning, and the version node must
  # match exactly: a `libonnxruntime.so` tagged VERS_1.27.1 does not satisfy a
  # consumer that asks for VERS_1.27.0. Android packages a single
  # `libonnxruntime.so` shared by sherpa's `libsherpa-onnx-c-api.so` and by the
  # `libonnxruntime4j_jni.so` that Supertonic TTS loads, so both must want the
  # same node. sherpa 1.13.5+ ships VERS_1.27.1, which has no
  # `com.microsoft.onnxruntime:onnxruntime-android` artifact on Maven Central,
  # leaving the JNI side unsatisfiable; 1.13.4 ships VERS_1.27.0, which Maven
  # publishes. Bump these only in lockstep with the version forced in
  # android/build.gradle and pinned in linux/CMakeLists.txt.
  sherpa_onnx_android_arm64: 1.13.4
  sherpa_onnx_android_armeabi: 1.13.4
  sherpa_onnx_android_x86: 1.13.4
  sherpa_onnx_android_x86_64: 1.13.4
  sherpa_onnx_ios: 1.13.4
  sherpa_onnx_linux: 1.13.4
  sherpa_onnx_macos: 1.13.4
  sherpa_onnx_windows: 1.13.4

dev_dependencies:
  # The `any` entries below are only imported by tests, to fake or mock a
  # plugin's platform interface. Their version is the one the plugin that ships
  # them resolves (and pubspec.lock pins); a bound here would only force a
  # second edit on every plugin major bump.
  # Parses Dart directives in test/architecture/feature_import_direction_test.dart.
  analyzer: ^10.2.0
  arb_utils: ^0.11.1
  archive: ^4.5.2
  build_runner: ^2.15.1
  camera_platform_interface: any
  cross_file: any
  dart_style: ^3.1.7
  drift_dev: ^2.34.0
  fake_async: ^1.3.3
  file_selector_platform_interface: any
  # flutter_launcher_icons: ^0.14.1
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons:
    git:
      url: https://github.com/devmil/flutter_launcher_icons
      ref: f23536e

  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  glados: ^1.1.7
  integration_test:
    sdk: flutter
  irondash_message_channel: any
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  msix: ^3.18.0
  objectbox_generator: ^5.3.2
  path_provider_platform_interface: any
  permission_handler_platform_interface: any
  plugin_platform_interface: any
  share_plus_platform_interface: any
  super_native_extensions: any
  url_launcher_platform_interface: any
  very_good_analysis: ^11.0.0
  yaml: ^3.1.4
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon_1024.png"
  image_path_ios: "assets/icon/app_icon_1024_square.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon_1024_mac.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"

analyzer:
  plugins:
    - drift

flutter:
  config:
    enable-swift-package-manager: false

  generate: true
  uses-material-design: true

  shaders:
    - shaders/ai_voice_input.frag
    - shaders/ai_thinking_line.frag

  fonts:
    - family: Inconsolata
      fonts:
        - asset: assets/fonts/Inconsolata/Inconsolata-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
    # Filled counterparts for the handful of icons that toggle between an
    # off and an on state. Lucide is stroke-only by design and ships no
    # filled set, so these are generated from Lucide's own SVG geometry —
    # see tool/icons/filled_font/README.md.
    - family: LottiFilled
      fonts:
        - asset: assets/fonts/LottiFilled/LottiFilled.ttf

  assets:
    - assets/plaza/
    - assets/design_system/
    - assets/icons/
    - assets/icon/
    - assets/lang/
    - assets/sqlite/
    - assets/tts/voice_styles/
    # from https://www.iconfinder.com/paomedia
    - assets/images/map/299087_marker_map_icon.png
    # from https://www.iconfinder.com/recepkutuk
    - assets/images/map/728975_location_map_marker_pin_place_icon.png
    - assets/images/tutorial/

flutter_native_splash:
  color: "#333333"
