# Docker Compose for the Matrix provisioning admin app
# Usage: docker compose -f docker-compose.matrix-admin.yml up
#
# Starts: matrix-provisioning-service, matrix-admin
# Admin UI available at: http://localhost:5174
#
# Required in .env (or the environment):
#   MATRIX_HOMESERVER   e.g. https://matrix.example.com
#   MATRIX_ADMIN_TOKEN  a long-lived Synapse admin access token (preferred), or
#   MATRIX_ADMIN_USER + MATRIX_ADMIN_PASSWORD as a fallback
#   API_KEY             regular client key, e.g. `openssl rand -hex 32`
#   ADMIN_API_KEY       admin key guarding provisioning, revocation and purging
#
# The two keys have no defaults on purpose. A checked-in default is a published
# credential: this file is public, so anyone who could reach the port would hold
# the admin key for a service that provisions and deletes real accounts. Compose
# fails the deploy instead.

services:
  matrix-provisioning-service:
    build:
      context: .
      dockerfile: matrix-provisioning-service/Dockerfile
    container_name: matrix-provisioning-service
    ports:
      - "8003:8003"
    environment:
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER}
      - MATRIX_ADMIN_TOKEN=${MATRIX_ADMIN_TOKEN:-}
      - MATRIX_ADMIN_USER=${MATRIX_ADMIN_USER:-}
      - MATRIX_ADMIN_PASSWORD=${MATRIX_ADMIN_PASSWORD:-}
      - API_KEYS=${API_KEY:?set API_KEY, e.g. openssl rand -hex 32}
      - ADMIN_API_KEYS=${ADMIN_API_KEY:?set ADMIN_API_KEY, e.g. openssl rand -hex 32}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      # The scheduled sweep deletes room history and media. On by default.
      - ENABLE_RETENTION_SWEEP=${ENABLE_RETENTION_SWEEP:-true}
      - RETENTION_SWEEP_HOURS=${RETENTION_SWEEP_HOURS:-24}
      - RETENTION_SWEEP_MEDIA=${RETENTION_SWEEP_MEDIA:-true}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-300}
      - ENABLE_REDEMPTION_POLLING=${ENABLE_REDEMPTION_POLLING:-true}
      # Play subscriptions stay fail-closed until every credential below is set.
      - ENABLE_PLAY_SUBSCRIPTIONS=${ENABLE_PLAY_SUBSCRIPTIONS:-false}
      - SUBSCRIPTION_ENCRYPTION_KEY_ID=${SUBSCRIPTION_ENCRYPTION_KEY_ID:-}
      - SUBSCRIPTION_ENCRYPTION_KEY_BASE64=${SUBSCRIPTION_ENCRYPTION_KEY_BASE64:-}
      - 'SUBSCRIPTION_DECRYPTION_KEYS_JSON=${SUBSCRIPTION_DECRYPTION_KEYS_JSON:-{}}'
      - PLAY_ACCOUNT_BINDING_KEY_BASE64=${PLAY_ACCOUNT_BINDING_KEY_BASE64:-}
      - PLAY_BASE_PLAN_IDS=${PLAY_BASE_PLAN_IDS:-monthly,annual}
      - PURCHASE_INTENT_ISSUANCE_LIMIT=${PURCHASE_INTENT_ISSUANCE_LIMIT:-10}
      - PURCHASE_INTENT_ISSUANCE_WINDOW_SECONDS=${PURCHASE_INTENT_ISSUANCE_WINDOW_SECONDS:-900}
      - PLAY_SIGNING_CERTIFICATE_SHA256=${PLAY_SIGNING_CERTIFICATE_SHA256:-}
      - PLAY_ALLOW_TEST_PURCHASES=${PLAY_ALLOW_TEST_PURCHASES:-false}
      - PLAY_RTDN_AUDIENCE=${PLAY_RTDN_AUDIENCE:-}
      - PLAY_RTDN_SERVICE_ACCOUNT_EMAIL=${PLAY_RTDN_SERVICE_ACCOUNT_EMAIL:-}
      - SUBSCRIPTION_RECONCILE_INTERVAL_SECONDS=${SUBSCRIPTION_RECONCILE_INTERVAL_SECONDS:-60}
      - SUBSCRIPTION_RECONCILE_BATCH_SIZE=${SUBSCRIPTION_RECONCILE_BATCH_SIZE:-50}
      - BUNDLE_CLAIM_REAPER_INTERVAL_SECONDS=${BUNDLE_CLAIM_REAPER_INTERVAL_SECONDS:-300}
      - BUNDLE_CLAIM_REAPER_BATCH_SIZE=${BUNDLE_CLAIM_REAPER_BATCH_SIZE:-50}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - LOG_LEVEL=INFO
      - PORT=8003
      # Trust only the nginx container's fixed address. Direct clients on the
      # published service port cannot forge X-Forwarded-For.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-172.28.0.10}
      - CORS_ALLOWED_ORIGINS=http://localhost:5174
    volumes:
      - provisioning-data:/app/data
    networks:
      matrix-admin-network:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  matrix-admin:
    build:
      context: ./matrix-admin
      args:
        # Baked into the JS bundle at build time, so it is readable by anyone
        # who can load the page. That is inherent to a keyed SPA with no login:
        # treat the admin UI as trusted-network-only, or put a reverse proxy
        # with real authentication in front of it.
        VITE_ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY, e.g. openssl rand -hex 32}
    container_name: matrix-admin-frontend
    ports:
      - "5174:5174"
    depends_on:
      - matrix-provisioning-service
    networks:
      matrix-admin-network:
        ipv4_address: 172.28.0.10

volumes:
  provisioning-data:
    driver: local

networks:
  matrix-admin-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
