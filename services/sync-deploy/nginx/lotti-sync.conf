# Host nginx for paid Lotti Sync. Copy to /etc/nginx/sites-available/, replace
# the three example hostnames, link into sites-enabled, then `nginx -t`.
#
#   matrix.example.com  Synapse client + media API (what the app syncs with)
#   api.example.com     the app's subscription routes and the Paddle webhook
#   sync.example.com    static pricing/checkout/legal pages (Paddle-approved domain)
#
# Everything not listed here returns 404: the Synapse admin API, federation,
# and every admin route of the provisioning service never leave the host.
# TLS: one certificate for all three names, obtained before this file is
# enabled — certbot certonly --nginx -d matrix.example.com -d api.example.com -d sync.example.com

limit_req_zone $binary_remote_addr zone=lotti_sync_client:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lotti_sync_checkout:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lotti_sync_webhook:10m rate=20r/s;

# Client IPs are not needed after the fact; keep the access log free of them.
log_format lotti_sync_noip '[$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/matrix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.example.com/privkey.pem;
    server_name matrix.example.com;
    access_log /var/log/nginx/lotti-sync-matrix.log lotti_sync_noip;

    # Must match Synapse max_upload_size.
    client_max_body_size 100M;

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.example.com"}}';
    }

    location ~ ^/_matrix/(client|media)/ {
        limit_req zone=lotti_sync_client burst=40 nodelay;
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # /sync long-polls for up to 30 s.
        proxy_read_timeout 90s;
    }

    # Explicit, so a future catch-all cannot open them by accident.
    location /_synapse/ { return 404; }
    location /_matrix/federation/ { return 404; }
    location /_matrix/key/ { return 404; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/matrix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.example.com/privkey.pem;
    server_name api.example.com;
    access_log /var/log/nginx/lotti-sync-api.log lotti_sync_noip;
    client_max_body_size 64k;

    # The app's anonymous entitlement, checkout, claim and portal routes.
    location ~ ^/api/v1/client/(subscriptions/(entitlements|bundle-claims/(deliver|confirm-rotation))|web-checkout/(sessions|session-status|claims|portal-sessions))$ {
        limit_req zone=lotti_sync_checkout burst=20 nodelay;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # Paddle's notification destination. Authenticated by its HMAC signature,
    # which the service checks over the exact raw body, so nginx must not
    # buffer-and-rewrite it.
    location = /api/v1/webhooks/paddle {
        limit_req zone=lotti_sync_webhook burst=40 nodelay;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8003;
    }

    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/matrix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.example.com/privkey.pem;
    server_name sync.example.com;
    access_log /var/log/nginx/lotti-sync-site.log lotti_sync_noip;

    root /srv/lotti-sync/site;
    index index.html;

    # Paddle.js runs here; nothing else is loaded from third parties.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.paddle.com; frame-src https://*.paddle.com; connect-src 'self' https://*.paddle.com; img-src 'self' data: https://*.paddle.com; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name matrix.example.com api.example.com sync.example.com;
    return 301 https://$host$request_uri;
}
