\* Three replicas, three writes (links and unlinks), writes stamped up to one
\* tick behind the clock, every version delivered in any order, repeatedly.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Lossy = FALSE
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    WriteSucceedsRow = TRUE
    ClampTimestamp = TRUE
    AtomicReceive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor
