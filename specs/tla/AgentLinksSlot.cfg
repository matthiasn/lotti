\* One slot -- a template's soul, or its improver -- assigned under two fresh
\* link ids on three replicas: three writes (assignments and removals),
\* stamped up to one tick behind the clock, delivered in any order,
\* repeatedly.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Lossy = FALSE
    Slot = TRUE
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    WriteSucceedsRow = TRUE
    ClampTimestamp = TRUE
    AtomicReceive = TRUE
    SlotRule = TRUE
    ClampCreatedAt = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SlotConverged Converged NoLostSuccessor SuccessorOutranks
