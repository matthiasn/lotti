\* Forks and joins: two devices (the second's clock ahead), three appends,
\* one join each, rows delivered once each in any order.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    SlowAppends = 2
    FastAppends = 1
    SlowStateWrites = 0
    FastStateWrites = 0
    MaxHeals = 1
    MaxCrashes = 0
    Skew = 3
    SafeRecovery = TRUE
    ChainEdgeGate = TRUE
    JoinEdgeGate = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Acyclic EdgesImmutable NoJoinOverNonTip Converged
PROPERTIES LocalHeadAdvances
