\* Healing: one append per device, a stale state write, one join per device
\* and one crash between a planned and a committed join. Sync delivers
\* everything and every wake over a complete fork heals it.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    SlowAppends = 1
    FastAppends = 1
    SlowStateWrites = 0
    FastStateWrites = 1
    MaxHeals = 1
    MaxCrashes = 1
    Skew = 3
    SafeRecovery = TRUE
    ChainEdgeGate = TRUE
    JoinEdgeGate = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Acyclic EdgesImmutable NoJoinOverNonTip Converged
PROPERTIES EventuallySingleHead LocalHeadAdvances
