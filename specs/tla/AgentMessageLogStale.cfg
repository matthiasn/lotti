\* Stale state rows: besides three appends, the fast device writes its state
\* row once more (a scheduling or wake-outcome write) — a version that can
\* win last-writer-wins with an older head, or none. No joins.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    SlowAppends = 2
    FastAppends = 1
    SlowStateWrites = 0
    FastStateWrites = 1
    MaxHeals = 0
    MaxCrashes = 0
    Skew = 3
    SafeRecovery = TRUE
    ChainEdgeGate = TRUE
    JoinEdgeGate = TRUE
    HeadMerge = TRUE
    TipAppend = TRUE
    AtomicReceive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Acyclic EdgesImmutable NoJoinOverNonTip Converged SettledHead
PROPERTIES LocalHeadAdvances HeadNeverRegresses AppendsOffTips
