\* Agent state: whole-row LWW plus G-counters, three replicas, stale and
\* null-clock writes, the throttle, and one tick of clock skew.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "state"
    StaleWrites = TRUE
    Throttle = TRUE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = FALSE
    IntentCarriesClock = TRUE
    FirstCounter = 1
    AbsentBelowZero = TRUE
    CanonAbsentBelowZero = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor OwnCountKept NoLostIncrement
