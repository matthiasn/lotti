\* Agent state with writes meant to move the row at its own timestamp (a
\* report head moved at an equal stamp), plus everything AgentReplication has.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "state"
    StaleWrites = TRUE
    Throttle = TRUE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = TRUE
    IntentCarriesClock = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor OwnCountKept NoLostIncrement LocalWriteTakesEffect
