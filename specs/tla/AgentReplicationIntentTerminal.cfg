\* A status override with writes meant to leave the terminal status they
\* read (a pre-warm moved earlier, a consumed window re-armed). Such a write
\* is a causal successor that ranks below its predecessor, so only
\* LocalWriteTakesEffect is claimed here: Converged is the RankDrop residual.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "terminal"
    StaleWrites = TRUE
    Throttle = TRUE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = TRUE
    IntentCarriesClock = TRUE
    FirstCounter = 1
    AbsentBelowZero = TRUE
    CanonAbsentBelowZero = TRUE
    Lossy = FALSE
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    WriteSeesTombstones = TRUE
    RecreateKeepsFields = TRUE
    AtomicReceive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK LocalWriteTakesEffect
