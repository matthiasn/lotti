\* The installed base: every host was created by a build that started its
\* counters at 0, so each host's first write adds `host: 0` to the clock it
\* extends. Agent state, as in AgentReplication, with writes meant to move
\* the row (`Intend`), received by the build after ADR 0080.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "state"
    StaleWrites = TRUE
    Throttle = TRUE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = TRUE
    IntentCarriesClock = TRUE
    FirstCounter = 0
    AbsentBelowZero = TRUE
    CanonAbsentBelowZero = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor OwnCountKept NoLostIncrement LocalWriteTakesEffect
