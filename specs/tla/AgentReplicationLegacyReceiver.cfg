\* A build from before ADR 0080 receiving: VectorClock.compare and the
\* canonical tiebreak still read an absent host as counter 0. Hosts created
\* after ADR 0080 start at counter 1, so their first write still dominates
\* the version it extends there. Terminal kind, as in
\* AgentReplicationTerminal.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "terminal"
    StaleWrites = TRUE
    Throttle = TRUE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = FALSE
    IntentCarriesClock = TRUE
    FirstCounter = 1
    AbsentBelowZero = FALSE
    CanonAbsentBelowZero = FALSE
    Lossy = FALSE
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    WriteSeesTombstones = TRUE
    RecreateKeepsFields = TRUE
    AtomicReceive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor
