\* A register removed and written again (a day plan deleted and redrafted, a
\* parsed item replaced by a re-parse): writes that remove the row or write
\* it live, from the row, a stale snapshot or no clock; re-creations of a
\* removed row (`Intend`); three replicas and one tick of clock skew.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "removal"
    StaleWrites = TRUE
    Throttle = FALSE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = TRUE
    IntentCarriesClock = TRUE
    FirstCounter = 1
    AbsentBelowZero = TRUE
    CanonAbsentBelowZero = TRUE
    Lossy = FALSE
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    WriteSeesTombstones = TRUE
    RecreateKeepsFields = TRUE
    AtomicReceive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor LocalWriteTakesEffect
