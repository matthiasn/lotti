\* The removal kind with any delivery lost and recovered by backfill: a
\* replica that lost a removal learns it from the writer's answer. Two
\* replicas: every lost delivery, with three, triples the state space.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "removal"
    StaleWrites = TRUE
    Throttle = FALSE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = TRUE
    IntentCarriesClock = TRUE
    FirstCounter = 1
    AbsentBelowZero = TRUE
    CanonAbsentBelowZero = TRUE
    Lossy = TRUE
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    WriteSeesTombstones = TRUE
    RecreateKeepsFields = TRUE
    AtomicReceive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor LocalWriteTakesEffect
