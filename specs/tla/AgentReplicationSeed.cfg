\* A default seeded under its well-known id at every start (a template, a
\* soul, a soul assignment), edited and deleted by the user, from the row, a
\* stale snapshot or no clock; three replicas that each seed it, and one
\* tick of clock skew.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "seeded"
    StaleWrites = TRUE
    Throttle = FALSE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = FALSE
    IntentCarriesClock = TRUE
    FirstCounter = 1
    AbsentBelowZero = TRUE
    CanonAbsentBelowZero = TRUE
    Lossy = FALSE
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    WriteSeesTombstones = TRUE
    RecreateKeepsFields = TRUE
    AtomicReceive = TRUE
    SeedSeesTombstones = TRUE
    SeedYields = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor SeedYieldsToRemoval
