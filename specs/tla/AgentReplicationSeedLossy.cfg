\* The seeded kind with any delivery lost and recovered by backfill: a
\* device that seeded before the deletion reached it learns the deletion
\* from the writer's answer. Two replicas: every lost delivery, with three,
\* triples the state space.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxWrites = 3
    MaxTime = 2
    Skew = 1
    Kind = "seeded"
    StaleWrites = TRUE
    Throttle = FALSE
    RankDrop = FALSE
    ThrottleKeepsTimestamp = TRUE
    CountersJoinAlways = TRUE
    ResolveLocalWrites = TRUE
    ClampTimestamp = TRUE
    IntentWrites = FALSE
    IntentCarriesClock = TRUE
    FirstCounter = 1
    AbsentBelowZero = TRUE
    CanonAbsentBelowZero = TRUE
    Lossy = TRUE
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    WriteSeesTombstones = TRUE
    RecreateKeepsFields = TRUE
    AtomicReceive = TRUE
    SeedSeesTombstones = TRUE
    SeedYields = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor SeedYieldsToRemoval
