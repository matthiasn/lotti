\* Two devices, two edits anywhere, no faults. The timer exceeds a heartbeat
\* plus a delivery delay, as two minutes exceed 45 seconds plus any connected
\* sync. Runs outlast the timer, so the heartbeat matters. Safety and liveness.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxEdits = 2
    Timeout = 4
    Heartbeat = 2
    MaxDelay = 1
    RunCap = 5
    MaxFailures = 0
    MaxCrashes = 0
    MaxLosses = 0
    WakeOnSync = TRUE
    CompareHash = TRUE
    SendHeartbeat = TRUE
    ReArmOnMessage = TRUE
    DoneCancels = TRUE
    ClaimsLapse = TRUE
    KeepDoneHistory = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Exclusive CancelCovered
PROPERTIES NoLostEdit OwedWakeSettles
