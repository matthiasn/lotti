\* Two devices, one crash. A crashed run sends no done, so its peer waits
\* out the timer and runs; the crashed device restores its wake. Exclusive
\* is not claimed: a crash erases the receiver's peer view.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxEdits = 2
    Timeout = 4
    Heartbeat = 2
    MaxDelay = 1
    RunCap = 5
    MaxFailures = 0
    MaxCrashes = 1
    MaxLosses = 0
    WakeOnSync = TRUE
    CompareHash = TRUE
    SendHeartbeat = TRUE
    ReArmOnMessage = TRUE
    DoneCancels = TRUE
    ClaimsLapse = TRUE
    KeepDoneHistory = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK CancelCovered
PROPERTIES NoLostEdit OwedWakeSettles
