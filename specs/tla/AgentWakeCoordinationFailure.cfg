\* Two devices, one failed run. A failure releases its claim, so a waiting
\* peer proceeds at once instead of after the timer; its own wake stays owed.
\* Exclusive holds: a failed run is not a run the peer should defer to.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxEdits = 2
    Timeout = 4
    Heartbeat = 2
    MaxDelay = 1
    RunCap = 5
    MaxFailures = 1
    MaxCrashes = 0
    MaxLosses = 0
    WakeOnSync = TRUE
    CompareHash = TRUE
    SendHeartbeat = TRUE
    ReArmOnMessage = TRUE
    DoneCancels = TRUE
    ClaimsLapse = TRUE
    KeepDoneHistory = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Exclusive CancelCovered
PROPERTIES NoLostEdit OwedWakeSettles
