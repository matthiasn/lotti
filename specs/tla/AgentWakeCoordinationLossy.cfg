\* Two devices, one lost message. A lost claim lets both run, and a lost
\* done means the peer runs after the timer, so Exclusive is not claimed;
\* nothing is dropped unprocessed and no owed wake waits forever.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxEdits = 2
    Timeout = 4
    Heartbeat = 2
    MaxDelay = 1
    RunCap = 5
    MaxFailures = 0
    MaxCrashes = 0
    MaxLosses = 1
    WakeOnSync = TRUE
    CompareHash = TRUE
    SendHeartbeat = TRUE
    ReArmOnMessage = TRUE
    DoneCancels = TRUE
    ClaimsLapse = TRUE
    KeepDoneHistory = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK CancelCovered
PROPERTIES NoLostEdit OwedWakeSettles
