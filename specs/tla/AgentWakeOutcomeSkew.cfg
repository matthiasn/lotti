    MaxTouches = 1
    SkewA = 3
    SkewB = 0
    StampAtEnd = TRUE
    OutcomeWatermarks = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK FailedFaceAgreedWhenInformed Converged
