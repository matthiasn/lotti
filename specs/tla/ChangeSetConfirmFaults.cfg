\* Two concurrent confirmers, recoverable faults, one crash anywhere. A crash
\* between the claim and the dispatch leaves the item confirmed but never
\* applied, so ConfirmedMeansApplied is not claimed here (README: residuals).
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    MaxAttempts = 2
    MaxCrashes = 1
    Faults = {"dispatchFails", "hookThrows"}
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOnceApply
