\* One device, one set: a follow-up task, its checklist migration and a
\* plain item, with confirms, rejects, dispatch failures (retryable and not),
\* the sibling rewrite, the cascade and a retraction interleaving freely.
SPECIFICATION Spec
CONSTANTS
    Devices = {1}
    Items = {t, m, x}
    SetItems = {}
    FollowUp = t
    Migration = m
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails", "nonRetryable"}
    MaxAttempts = 2
    MaxAgentOps = 1
    MaxReopens = 0
    MaxUserEdits = 0
    UserRestoresBase = FALSE
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
    CrashBeforeLink = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOnceApply AppliedStaysDecided StatusMatchesEffect MigrationAfterTarget NoDuplicateEffects
