\* One device, one set: a follow-up task, its checklist migration and a
\* plain item, with confirms, rejects, dispatch failures (retryable and not),
\* the sibling rewrite, the cascade and a retraction interleaving freely.
SPECIFICATION Spec
CONSTANTS
    Devices = {1}
    Items = {t, m, x}
    FollowUp = t
    Migration = m
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails", "nonRetryable"}
    MaxAttempts = 2
    MaxAgentOps = 1
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOnceApply AppliedStaysDecided StatusMatchesEffect MigrationAfterTarget
