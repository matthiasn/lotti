\* One device, two sets: a wake consolidates the older set into the survivor
\* while the original item is confirmed, fails or is retracted.
SPECIFICATION Spec
CONSTANTS
    Devices = {1}
    Items = {x, c}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = x
    CopyDst = c
    NoItem = NoItem
    Faults = {"dispatchFails", "nonRetryable"}
    MaxAttempts = 2
    MaxAgentOps = 2
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOnceApply AppliedStaysDecided StatusMatchesEffect
