\* Two devices, two sets: one device's wake consolidates the older set while
\* the other confirms the original. The copy carries its original's effect
\* key, so confirming the copy as well writes the same entity.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {x, c}
    SetItems = {}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = x
    CopyDst = c
    NoItem = NoItem
    Faults = {"dispatchFails"}
    MaxAttempts = 1
    MaxAgentOps = 1
    MaxReopens = 0
    MaxUserEdits = 0
    UserRestoresBase = FALSE
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateEffects EffectsConverge
