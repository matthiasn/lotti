\* Two devices decide the same item before they have synced — the race no
\* local transaction can close. The item is confirmed, rejected or retracted
\* on either device; dispatches fail and revert. Both devices may apply the
\* change, which breaks every property but convergence (README: residuals);
\* the replicas still agree once everything is delivered.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {x}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails"}
    MaxAttempts = 2
    MaxAgentOps = 1
    RaceFree = FALSE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged
