\* Two devices decide the same item before they have synced — the race no
\* local transaction can close. The item is confirmed, rejected or retracted
\* on either device; dispatches fail and revert. Both devices may dispatch
\* the change (AtMostOnceApply fails, README: residuals), but the tool derives
\* its entity from the item, so both dispatches write the same entity: the
\* journals converge on one, and the replicas of the set agree.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {x}
    SetItems = {}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails"}
    MaxAttempts = 2
    MaxAgentOps = 1
    MaxReopens = 0
    MaxUserEdits = 0
    UserRestoresBase = FALSE
    RaceFree = FALSE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoDuplicateEffects EffectsConverge
