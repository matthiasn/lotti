\* Two devices confirm the same label suggestion before they have synced,
\* and the user takes the label off the task on either device. Taking a
\* label off suppresses it, and an add skips a suppressed label, so a late
\* second application cannot bring back a label the user removed once it
\* has seen the removal; a removal the device had not yet seen is
\* concurrent, and the journal leaves it as a Conflict row (ADR 0097).
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {s}
    SetItems = {s}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails"}
    MaxAttempts = 2
    MaxAgentOps = 0
    MaxReopens = 0
    MaxUndos = 0
    MaxUserEdits = 1
    AddStyle = TRUE
    EffectMark = TRUE
    UserRestoresBase = FALSE
    RaceFree = FALSE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
    CrashBeforeLink = FALSE
    RemoveWins = TRUE
    UndoRekeys = TRUE
    UndoOwnKey = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoClobber EffectsConverge
