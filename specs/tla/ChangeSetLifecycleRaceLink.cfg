\* Two devices confirm the same item before they have synced, and the item
\* creates an entity that is linked to its parent by a second write that syncs
\* apart — a checklist and its task's checklistIds. A device can hold the
\* other's entity without its link; it must link that entity rather than
\* create another, and every entity ends up linked everywhere.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {x}
    SetItems = {}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {}
    MaxAttempts = 2
    MaxAgentOps = 1
    MaxReopens = 0
    MaxUserEdits = 0
    UserRestoresBase = FALSE
    RaceFree = FALSE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = TRUE
    ReuseLive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoDuplicateEffects EffectsConverge EffectsLinked
