\* Two devices confirm the same set-style change before they have synced,
\* and the user's edit restores the field to the value the proposal was made
\* against — after seeing the change applied, say. The value compare-and-set
\* cannot tell that restore from the untouched base; the effect key the
\* first application recorded on the task can, so the late second
\* application leaves the restored value alone (ADR 0098).
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {s}
    SetItems = {s}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails"}
    MaxAttempts = 2
    MaxAgentOps = 0
    MaxReopens = 0
    MaxUndos = 0
    MaxUserEdits = 1
    AddStyle = FALSE
    UserRestoresBase = TRUE
    EffectMark = TRUE
    RaceFree = FALSE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
    CrashBeforeLink = FALSE
    RemoveWins = TRUE
    UndoRekeys = TRUE
    UndoOwnKey = TRUE
    RevertFirst = TRUE
    RevertIdempotent = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoClobber EffectsConverge
