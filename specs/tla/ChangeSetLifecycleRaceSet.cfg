\* Two devices confirm the same set-style change (a task title, say) before
\* they have synced, and the user edits the field on either device. The
\* compare-and-set keeps a late second application from overwriting the
\* user's edit once it has seen it; a write the device had not yet seen is
\* concurrent, and the journal leaves it as a Conflict row.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {s}
    SetItems = {s}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails"}
    MaxAttempts = 2
    MaxAgentOps = 0
    MaxReopens = 0
    MaxUserEdits = 1
    UserRestoresBase = FALSE
    RaceFree = FALSE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoClobber EffectsConverge
