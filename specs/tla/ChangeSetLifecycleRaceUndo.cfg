    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails", "revertRefused"}
    MaxAttempts = 2
    MaxAgentOps = 0
    MaxReopens = 0
    MaxUndos = 1
    MaxUserEdits = 0
    AddStyle = FALSE
    EffectMark = TRUE
    UserRestoresBase = FALSE
    RaceFree = FALSE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
    CrashBeforeLink = FALSE
    RemoveWins = TRUE
    UndoRekeys = TRUE
    UndoOwnKey = TRUE
    RevertFirst = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoDuplicateEffects EffectsConverge
