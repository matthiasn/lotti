\* One device: an item is confirmed, reopened while the dispatch runs, and
\* confirmed again; either dispatch may fail, retryably or not. A failed
\* dispatch must not revert the later claim (the revision guard), and the
\* second dispatch must not create a second entity.
SPECIFICATION Spec
CONSTANTS
    Devices = {1}
    Items = {x}
    SetItems = {}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails", "nonRetryable"}
    MaxAttempts = 2
    MaxAgentOps = 1
    MaxReopens = 1
    MaxUserEdits = 0
    UserRestoresBase = FALSE
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
    CrashBeforeLink = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SucceededClaimStands NoDuplicateEffects
