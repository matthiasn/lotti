\* Two devices, one set of two plain items: each device decides items and
\* retracts one, dispatches fail and revert, and every write syncs to the
\* other device as a message delivered in any order. No item is decided on
\* both devices before they have synced (RaceFree).
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {x, y}
    SetItems = {}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails"}
    MaxAttempts = 1
    MaxAgentOps = 1
    MaxReopens = 0
    MaxUserEdits = 0
    UserRestoresBase = FALSE
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOnceApply AppliedStaysDecided StatusMatchesEffect Converged NoDuplicateEffects EffectsConverge
