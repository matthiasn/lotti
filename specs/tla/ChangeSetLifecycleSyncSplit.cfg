\* Two devices, a follow-up task and its checklist migration: the task is
\* created on one device, the migration's target rewritten and synced, and
\* the migration confirmed or cascade-rejected on either device.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Items = {t, m}
    SetItems = {}
    FollowUp = t
    Migration = m
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails"}
    MaxAttempts = 1
    MaxAgentOps = 1
    MaxReopens = 0
    MaxUserEdits = 0
    UserRestoresBase = FALSE
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOnceApply AppliedStaysDecided StatusMatchesEffect Converged MigrationAfterTarget NoDuplicateEffects EffectsConverge
