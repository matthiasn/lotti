\* One device: a create-style item — the project agent's create_task — is
\* confirmed and applied, undone (its task deleted, the item reopened), and
\* confirmed again; either dispatch may fail. Confirming after the Undo must
\* create the task anew rather than find the undone one's tombstone, and
\* never leave two live tasks (ADR 0097).
SPECIFICATION Spec
CONSTANTS
    Devices = {1}
    Items = {x}
    SetItems = {}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails", "revertRefused"}
    MaxAttempts = 2
    MaxAgentOps = 0
    MaxReopens = 0
    MaxUndos = 1
    MaxUserEdits = 0
    AddStyle = FALSE
    EffectMark = TRUE
    UserRestoresBase = FALSE
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
    CrashBeforeLink = FALSE
    RemoveWins = TRUE
    UndoRekeys = TRUE
    UndoOwnKey = TRUE
    RevertFirst = TRUE
    RevertIdempotent = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SucceededClaimStands NoDuplicateEffects ConfirmedIsLive
