\* One device: a create-style item is confirmed and applied, and undone;
\* the Undo's reopen may fail after its revert deleted the entity, leaving
\* the item confirmed, and the Undo is offered again. The retry must reopen
\* the item — its revert finding the entity it already deleted — and never
\* leave it confirmed with no way back (ADR 0097).
SPECIFICATION FairSpec
CONSTANTS
    Devices = {1}
    Items = {x}
    SetItems = {}
    FollowUp = NoItem
    Migration = NoItem
    CopySrc = NoItem
    CopyDst = NoItem
    NoItem = NoItem
    Faults = {"dispatchFails", "revertRefused", "reopenFails"}
    MaxAttempts = 2
    MaxAgentOps = 0
    MaxReopens = 0
    MaxUndos = 2
    MaxUserEdits = 0
    AddStyle = FALSE
    EffectMark = TRUE
    UserRestoresBase = FALSE
    RaceFree = TRUE
    AtomicWrites = TRUE
    AtomicReceive = TRUE
    ItemMerge = TRUE
    PendingCopiesOnly = TRUE
    RevisionGuard = TRUE
    ClaimResolvesTarget = TRUE
    DerivedIds = TRUE
    CopyCarriesKey = TRUE
    CasGuard = TRUE
    SeparateAttach = FALSE
    ReuseLive = TRUE
    CrashBeforeLink = FALSE
    RemoveWins = TRUE
    UndoRekeys = TRUE
    UndoOwnKey = TRUE
    RevertFirst = TRUE
    RevertIdempotent = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SucceededClaimStands NoDuplicateEffects ConfirmedIsLive
PROPERTIES UndoFinishes
