\* One task with a checklist and room for a second, three items, four
\* operations across the screen and the agent, and two versions landing by
\* sync: every interleaving of reads, writes and screen refreshes.
SPECIFICATION Spec
CONSTANTS
    Lists = {c1, c2}
    First = c1
    Items = {i1, i2, i3}
    MaxOps = 4
    MaxReceives = 2
    MaxCrashes = 0
    RebaseLists = TRUE
    RebaseTask = TRUE
    RebaseItems = TRUE
    WidgetFollowsTask = TRUE
    IntentLog = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicates NoLostItem NoStrayItem BackLinkAgrees NoLostChecklist PageShowsChecklists
