\* A delete's write fails once — an item deleted from its checklist, or a
\* checklist from its task — and the app is closed and started again later;
\* the next start replays what was kept (DeleteReportsFailure).
SPECIFICATION Spec
CONSTANTS
    Lists = {c1, c2}
    First = c1
    Items = {i1, i2}
    MaxOps = 4
    MaxReceives = 1
    MaxCrashes = 0
    MaxFailures = 1
    RebaseLists = TRUE
    RebaseTask = TRUE
    RebaseItems = TRUE
    WidgetFollowsTask = TRUE
    IntentLog = TRUE
    DeleteReportsFailure = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicates NoLostItem NoStrayItem BackLinkAgrees NoLostChecklist PageShowsChecklists
