\* Three checklists, so one can be sorted on the task page while a third
\* arrives by sync or from the agent (PageShowsChecklists).
SPECIFICATION Spec
CONSTANTS
    Lists = {c1, c2, c3}
    First = c1
    Items = {i1, i2}
    MaxOps = 3
    MaxReceives = 2
    MaxCrashes = 0
    RebaseLists = TRUE
    RebaseTask = TRUE
    RebaseItems = TRUE
    WidgetFollowsTask = TRUE
    IntentLog = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicates NoLostItem NoStrayItem BackLinkAgrees NoLostChecklist PageShowsChecklists
