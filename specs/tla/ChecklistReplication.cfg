\* Two devices, three checklists and one item: moves, checks and deletions
\* of the item on both devices at once, checklists deleted under them, every
\* row delivered on its own in any order, and the user resolving what
\* conflicts.
SPECIFICATION Spec
CONSTANTS
    N = 2
    TaskId = t
    Lists = {c1, c2, c3}
    Initial = {c1, c2, c3}
    First = c1
    Items = {i1}
    Seeded = {i1}
    Ops = {"move", "check", "dropItem", "dropList"}
    MaxOps = 3
    MaxResolves = 1
    MaxCrashes = 0
    DerivedIds = FALSE
    ItemsByHome = TRUE
    JoinOnResolve = TRUE
    RelistOnResolve = TRUE
    UnlistFirst = TRUE
    ReplayGuard = TRUE
    Cascade = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicates ShownOnce NeverSilent NoLostItem NoOrphanItem NoLostChecklist
