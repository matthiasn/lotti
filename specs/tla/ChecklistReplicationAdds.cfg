\* Two devices adding: items to one checklist at once, the same derived item
\* id into different checklists (the migration handler's copy), checklists
\* to the task at once, and task field edits -- while checklists are deleted
\* under them.
SPECIFICATION Spec
CONSTANTS
    N = 2
    TaskId = t
    Lists = {c1, c2}
    Initial = {c1}
    First = c1
    Items = {i1, i2}
    Seeded = {}
    Ops = {"add", "addList", "dropList", "taskEdit"}
    MaxOps = 3
    MaxResolves = 2
    MaxCrashes = 0
    DerivedIds = TRUE
    ItemsByHome = TRUE
    JoinOnResolve = TRUE
    RelistOnResolve = TRUE
    UnlistFirst = TRUE
    ReplayGuard = TRUE
    Cascade = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicates ShownOnce NeverSilent NoLostItem NoOrphanItem NoLostChecklist
