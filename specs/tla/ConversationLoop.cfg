\* One caller sending twice into one conversation (a wake and its forced
\* update_report retry): up to three tool calls a round, a history trimmed at
\* nine messages, a six-turn limit and one strategy that throws.
SPECIFICATION Spec
CONSTANTS
    Senders = 1
    SendsEach = 2
    MaxTurns = 6
    MaxHistory = 9
    MaxCalls = 3
    ThrowBudget = 1
    MonotonicTurns = TRUE
    TailFromUser = TRUE
    AnswerPending = TRUE
    Serialize = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK BoundedRounds UniqueToolCallIds NoOrphanResult
           EveryCallAnswered OpensWithUserTurn
PROPERTIES Terminates
