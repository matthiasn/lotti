\* Two callers sending twice each into one conversation, at once (evolution
\* chat messages racing): up to two tool calls a round, a history trimmed at
\* eight messages, a five-turn limit and one strategy that throws.
SPECIFICATION Spec
CONSTANTS
    Senders = 2
    SendsEach = 2
    MaxTurns = 5
    MaxHistory = 8
    MaxCalls = 2
    ThrowBudget = 1
    RetryBudget = 0
    MonotonicTurns = TRUE
    TailFromUser = TRUE
    AnswerPending = TRUE
    Serialize = TRUE
    BudgetedRetry = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK BoundedRounds UniqueToolCallIds NoOrphanResult
           EveryCallAnswered OpensWithUserTurn RetryRuns
PROPERTIES Terminates
