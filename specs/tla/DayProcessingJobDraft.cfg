\* A draft job: provenance falls back to requestedAt when no run key is
\* recorded. Two workers, one crash, one cancel or retry tap.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    Kind = "draft"
    MaxWakes = 4
    MaxAttempts = 2
    MaxCrashes = 1
    MaxUser = 1
    AttachToLiveWake = TRUE
    RecheckBeforeEnqueue = TRUE
    ProvenanceRace = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOneLiveWake NoInferenceAfterArtifact AtMostOneArtifact Fenced
PROPERTIES EventuallySettled
