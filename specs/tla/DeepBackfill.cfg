\* Two devices, one record that either may lack, written twice anywhere --
\* edits, deletions, concurrent versions, resolutions -- both running
\* maintenance, no incremental sync: deep backfill alone must reach the union,
\* tombstones included, and then fall quiet.
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    NI = 1
    BatchSize = 1
    MaxWrites = 2
    Runners = {1, 2}
    LossBudget = 0
    MaxCrashes = 0
    Incremental = FALSE
    Merge = FALSE
    AdvertiseTombstones = TRUE
    PushNewer = TRUE
    RangeBounds = TRUE
    DedupeOutstanding = TRUE
    DurableOutstanding = TRUE
    SkipHeldConflict = TRUE
    AdvertiseConflicts = TRUE
    ClearOnlyCovered = TRUE
    ConflictsTravel = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK InventoryIsReal NoDuplicateRequest NoLostTombstone NothingDropped ConflictNotStale
PROPERTIES EventuallyConverged EventuallyQuiet RoundTerminates
