\* One lost message and one crash, anywhere in a round: a lost batch, request,
\* answer or push, and a restart mid-flow. The next round repairs it.
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    NI = 1
    BatchSize = 1
    MaxWrites = 1
    Runners = {1, 2}
    LossBudget = 1
    MaxCrashes = 1
    Incremental = FALSE
    Merge = FALSE
    AdvertiseTombstones = TRUE
    PushNewer = TRUE
    RangeBounds = TRUE
    DedupeOutstanding = TRUE
    DurableOutstanding = TRUE
    SkipHeldConflict = TRUE
    AdvertiseConflicts = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK InventoryIsReal NoDuplicateRequest NoLostTombstone NothingDropped ConflictNotStale
PROPERTIES EventuallyConverged EventuallyQuiet RoundTerminates
