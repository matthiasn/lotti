\* Two devices, one record whose file either may lack or hold cut short,
\* one more truncation anywhere, both running rounds, resending off: deep
\* backfill alone must leave both with the whole file, then fall quiet.
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    NI = 1
    Full = 2
    Runners = {1, 2}
    Resend = FALSE
    LossBudget = 0
    MaxCrashes = 0
    MaxFaults = 1
    AdvertiseMedia = TRUE
    ReplaceShorter = TRUE
    NeverShrink = TRUE
    AnswerIgnoresFlag = TRUE
    DedupeOutstanding = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateRequest
PROPERTIES NoShrink EventuallyComplete EventuallyQuiet RoundTerminates
