\* Two records, so a round of two batches.
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    NI = 2
    Full = 1
    Runners = {1, 2}
    Resend = FALSE
    LossBudget = 0
    MaxCrashes = 0
    MaxFaults = 1
    AdvertiseMedia = TRUE
    ReplaceShorter = TRUE
    NeverShrink = TRUE
    AnswerIgnoresFlag = TRUE
    DedupeOutstanding = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateRequest
PROPERTIES NoShrink EventuallyComplete EventuallyQuiet RoundTerminates
