\* Resending attachments switched on: ordinary sync may carry any copy,
\* whole or cut short, at any time -- a shorter one must never replace a
\* longer one. (Resends are unbounded, so the room never falls quiet.)
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    NI = 1
    Full = 2
    Runners = {1, 2}
    Resend = TRUE
    LossBudget = 0
    MaxCrashes = 0
    MaxFaults = 1
    AdvertiseMedia = TRUE
    ReplaceShorter = TRUE
    NeverShrink = TRUE
    AnswerIgnoresFlag = TRUE
    DedupeOutstanding = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateRequest
PROPERTIES NoShrink EventuallyComplete RoundTerminates
