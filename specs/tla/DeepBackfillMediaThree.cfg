\* Three devices, only device 1 running rounds: both recipients answer and
\* push to device 1 alone, and a file only device 3 holds whole must still
\* reach device 2 -- through device 1.
SPECIFICATION FairSpec
CONSTANTS
    N = 3
    NI = 1
    Full = 1
    Runners = {1}
    Resend = FALSE
    LossBudget = 0
    MaxCrashes = 0
    MaxFaults = 1
    AdvertiseMedia = TRUE
    ReplaceShorter = TRUE
    NeverShrink = TRUE
    AnswerIgnoresFlag = TRUE
    DedupeOutstanding = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateRequest
PROPERTIES NoShrink EventuallyComplete EventuallyQuiet RoundTerminates
