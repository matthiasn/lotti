\* Only device 1 runs maintenance -- the manual round pressed on one device.
\* Device 2 must still receive what it lacks and send back what it holds
\* newer, or holds alone.
SPECIFICATION FairSpec
CONSTANTS
    N = 2
    NI = 1
    BatchSize = 1
    MaxWrites = 2
    Runners = {1}
    LossBudget = 0
    MaxCrashes = 0
    Incremental = FALSE
    Merge = FALSE
    AdvertiseTombstones = TRUE
    PushNewer = TRUE
    RangeBounds = TRUE
    DedupeOutstanding = TRUE
    DurableOutstanding = TRUE
    SkipHeldConflict = TRUE
    AdvertiseConflicts = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK InventoryIsReal NoDuplicateRequest NoLostTombstone NothingDropped ConflictNotStale
PROPERTIES EventuallyConverged EventuallyQuiet RoundTerminates
