\* Two devices, three envelopes, one restore and one revocation, with the room
\* free to forget anything. Every design switch on.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxWrites = 3
    MaxRestores = 1
    MaxRevocations = 1
    AtomicSeq = TRUE
    RotateKeyOnRestore = TRUE
    ServeEnvelopeLog = TRUE
    RetroactiveRevocation = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK ChainContinuous NoFork ForkNeverApplied AcceptedIsPrefix NoAcceptBeyondRevocation
PROPERTIES EventuallyApplied
