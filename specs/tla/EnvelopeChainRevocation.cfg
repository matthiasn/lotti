\* Three devices, so a revocation can reach one that already accepted past it.
\* Three envelopes and one revocation; no restore. Every design switch on.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    MaxRestores = 0
    MaxRevocations = 1
    AtomicSeq = TRUE
    RotateKeyOnRestore = TRUE
    ServeEnvelopeLog = TRUE
    RetroactiveRevocation = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK ChainContinuous NoFork ForkNeverApplied AcceptedIsPrefix NoAcceptBeyondRevocation
PROPERTIES EventuallyApplied
