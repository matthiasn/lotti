\* Two devices with their own clocks, two tokens, connecting, disconnecting,
\* re-sending and revoking in any order: every device ends on the newest
\* version, and shows a token only once it checked it with GitHub itself.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    TokenCount = 2
    MaxClock = 3
    MaxChanges = 3
    BumpStamp = TRUE
    DeterministicTies = TRUE
    VerifyReceived = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK ShownWasChecked Converged
PROPERTY LocalChangeOutranks
