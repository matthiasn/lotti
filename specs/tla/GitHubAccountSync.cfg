\* Two devices with their own clocks, two tokens, connecting, disconnecting,
\* re-sending and revoking in any order, with the outbox refusing a send and
\* GitHub checks answering late: every device ends on the newest version,
\* never goes back to an older one, and shows a token only once it checked
\* that version with GitHub itself.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    TokenCount = 2
    MaxClock = 3
    MaxChanges = 3
    BumpStamp = TRUE
    DeterministicTies = TRUE
    VerifyReceived = TRUE
    VerifyMatchesVersion = TRUE
    AtomicApply = TRUE
    RetryOwed = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK ShownWasChecked Converged
PROPERTIES LocalChangeOutranks StampNeverGoesBack
