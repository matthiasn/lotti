\* As GoalRegister, and one device restarts: in-flight runs and the sync
\* dispatcher's in-memory queue are lost.
SPECIFICATION Spec
CONSTANTS
    N = 2
    K = 2
    Hidden = 0
    Lock = "agent"
    Validate = "rederive"
    Escalate = "contradicted"
    Restart = "recompute"
    ArmAt = "commit"
    OnSynced = "ignore"
    MaxTick = 9
    MaxCrashes = 1
    MaxDeaths = 0
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged Complete ReportCurrent EscalationDurable
