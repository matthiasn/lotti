\* One device never comes back. Only EscalationDurable is claimed here: a
\* device that acts on a journal still missing evidence and then dies leaves
\* a row or a report no peer can tell is stale (the README's residual).
SPECIFICATION Spec
CONSTANTS
    N = 2
    K = 2
    Hidden = 0
    Lock = "agent"
    Validate = "rederive"
    Escalate = "contradicted"
    Restart = "recompute"
    ArmAt = "commit"
    OnSynced = "ignore"
    MaxTick = 9
    MaxCrashes = 0
    MaxDeaths = 1
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK EscalationDurable
