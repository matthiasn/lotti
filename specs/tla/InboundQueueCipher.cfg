\* Ciphertext: event 2 arrives without a key (the key may arrive later), and
\* one resume-floor write or one queue insert may throw, retaining the floor
\* in memory. A crash or a stop; no resurrection passes.
SPECIFICATION Spec
CONSTANTS
    N = 3
    InitTip = 1
    EncInit = {2}
    MaxDowns = 1
    FaultBudget = 1
    Faults = {"floorWrite", "enqueue"}
    MaxRetries = 1
    MaxResurrections = 0
    GapRecovery = TRUE
    ClaimOnStart = TRUE
    ClaimOnGap = TRUE
    ClaimOnWalk = TRUE
    CheckpointForward = TRUE
    FailedEnqueueLowersFloor = TRUE
    WorkerSurvivesErrors = TRUE
    GuardedResurrect = TRUE
    ResurrectRechecksCap = TRUE
    RetainFailedClaim = TRUE
    HardCap = 1
    SliceRace = TRUE
    HoldAnchor = TRUE
    HoldWhileRetained = TRUE
    IgnoreSyntheticSync = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoSilentLossAfterRestart HeldIsLeased CapHolds
PROPERTIES MarkerMonotone AppliedIsFinal
