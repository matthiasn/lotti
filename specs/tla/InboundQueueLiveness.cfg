\* Liveness under fairness: the worker drains, walks run, the live stream
\* delivers and a stopped app starts again. One worker throw, one
\* incomplete walk or a failed live enqueue, one retry, a crash or a stop.
SPECIFICATION LiveSpec
CONSTANTS
    N = 3
    InitTip = 1
    EncInit = {}
    MaxDowns = 1
    FaultBudget = 1
    Faults = {"enqueue", "worker", "walk"}
    MaxRetries = 1
    MaxResurrections = 0
    GapRecovery = FALSE
    ClaimOnStart = TRUE
    ClaimOnGap = TRUE
    ClaimOnWalk = TRUE
    CheckpointForward = TRUE
    FailedEnqueueLowersFloor = TRUE
    WorkerSurvivesErrors = TRUE
    GuardedResurrect = TRUE
    ResurrectRechecksCap = TRUE
    RetainFailedClaim = TRUE
    HardCap = 1
    AdmitResponses = TRUE
    SliceRace = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES QueuedEventuallySettled EventuallyCaptured
