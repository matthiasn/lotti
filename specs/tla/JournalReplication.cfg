\* One journal entry on three devices: edits and deletions of the stored row
\* and of an entry read earlier, restores of a deleted entry, the user's
\* conflict resolutions, and deliveries in any order, any number of times.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxWrites = 3
    Stale = TRUE
    Resolves = TRUE
    Restores = TRUE
    Labels = FALSE
    NullBase = FALSE
    Lossy = FALSE
    Sidecars = FALSE
    Rollbacks = 0
    Queued = 2
    \* The fixes of ADR 0083.
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    ConflictSeesTombstone = TRUE
    ResolveOnlyCovered = TRUE
    KeepNewerConflict = TRUE
    LabelsRebuild = TRUE
    RefuseNullClock = TRUE
    RestoreSidecar = TRUE
    RefreshThroughQueue = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor NothingDropped ConflictNotStale ConflictResolvable
