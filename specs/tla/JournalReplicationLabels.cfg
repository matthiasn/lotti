\* Two devices with label writes (setLabels, suppressLabelOnTask) racing the
\* versions that sync in while they are written. One write more, since a label
\* write that is built again takes two ids.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxWrites = 4
    Stale = TRUE
    Resolves = TRUE
    Restores = TRUE
    Labels = TRUE
    NullBase = FALSE
    Lossy = FALSE
    \* The fixes of ADR 0083.
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    ConflictSeesTombstone = TRUE
    ResolveOnlyCovered = TRUE
    KeepNewerConflict = TRUE
    LabelsRebuild = TRUE
    RefuseNullClock = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor NothingDropped ConflictNotStale ConflictResolvable
