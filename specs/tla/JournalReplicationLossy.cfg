\* Two devices whose deliveries may be lost and recovered by backfill from the
\* writer's stored row: a lost deletion must still arrive.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxWrites = 3
    Stale = TRUE
    Resolves = TRUE
    Restores = TRUE
    Labels = FALSE
    NullBase = FALSE
    Lossy = TRUE
    \* The fixes of ADR 0083.
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    ConflictSeesTombstone = TRUE
    ResolveOnlyCovered = TRUE
    KeepNewerConflict = TRUE
    LabelsRebuild = TRUE
    RefuseNullClock = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor NothingDropped ConflictNotStale ConflictResolvable
