\* Two devices whose receives come from an older peer, naming only a path: the
\* loader saves the incoming JSON over the sidecar before the write decision.
\* With the sidecar queue, the outbox's refresh and conflict resolutions. At
\* most two sidecar writes are queued per device (QueueBound).
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxWrites = 3
    Stale = FALSE
    Resolves = TRUE
    Restores = TRUE
    Labels = FALSE
    NullBase = FALSE
    Lossy = FALSE
    Sidecars = TRUE
    Rollbacks = 0
    Queued = 2
    \* The fixes of ADR 0083.
    ReceiveSeesTombstones = TRUE
    BackfillServesTombstones = TRUE
    ConflictSeesTombstone = TRUE
    ResolveOnlyCovered = TRUE
    KeepNewerConflict = TRUE
    LabelsRebuild = TRUE
    RefuseNullClock = TRUE
    RestoreSidecar = TRUE
    RefreshThroughQueue = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Converged NoLostSuccessor NothingDropped ConflictNotStale ConflictResolvable SidecarMatchesRow
CONSTRAINT QueueBound
