\* Two devices and two sources: device 1 captures three times and compacts
\* twice, device 2 captures and compacts once; links, payloads and
\* checkpoints arrive late and in any order.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Sources = {s1, s2}
    LeadCaptures = 3
    PeerCaptures = 1
    LeadFolds = 2
    PeerFolds = 1
    DigestCoverage = TRUE
    FoldStopsAtGap = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostContext NoDeadCheckpoint Converged
