\* One entity written three times by in-order callers, its first version
\* owing the attachment, and one simple message; bundles of two, failed
\* sends, a crash or teardown, and a mark that throws. Every property holds,
\* including per-entity send order.
\* Liveness is checked in OutboxOperator and OutboxGhost: with this state
\* space TLC's fairness check takes far longer than the safety check.
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    SimpleMsgs = {m}
    MaxVersion = 3
    MediaVersions = {1}
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 1
    Faults = {"sendFail", "markFail"}
    InOrderEnqueue = TRUE
    UserActions = FALSE
    UserRemoves = FALSE
    NewestByClock = TRUE
    CoverCollapsed = TRUE
    CarryMedia = TRUE
    AbsorbErrorRows = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered MediaNotDropped NewestLandsLast
PROPERTIES RowsImmutable PruneOnlySent
