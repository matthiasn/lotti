\* One entity written three times by in-order callers and one simple message,
\* bundles of two, failed sends, a crash, and a mark that throws. Every
\* property holds, including per-entity send order.
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    SimpleMsgs = {m}
    MaxVersion = 3
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 1
    Faults = {"sendFail", "markFail"}
    InOrderEnqueue = TRUE
    UserActions = FALSE
    KeyedEnqueueLock = TRUE
    NewestPayloadWins = TRUE
    CoverOnlyOlder = TRUE
    ReleaseBeforeDrain = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered NewestLandsLast
PROPERTIES MergeNeverRegresses PruneOnlySent EveryRowSettles EnqueuedIsDelivered
