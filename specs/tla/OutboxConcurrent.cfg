\* Three versions of one entity enqueued by concurrent callers in any order,
\* the first owing the attachment; bundles of two, failed sends, a mark that
\* throws and a crash or teardown. Appends lose nothing and the collapse
\* sends the newest version by clock. Arrival order is the callers' own, so
\* NewestLandsLast is not claimed here.
\* Liveness is checked in OutboxConcurrentLive, a smaller copy.
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    RowKeys = {}
    SimpleMsgs = {}
    MaxVersion = 3
    MediaVersions = {1}
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 1
    Faults = {"sendFail", "markFail"}
    InOrderEnqueue = FALSE
    UserActions = FALSE
    UserRemoves = FALSE
    NewestByClock = TRUE
    CoverCollapsed = TRUE
    CarryMedia = TRUE
    AbsorbErrorRows = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
    StampedReceiver = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered MediaNotDropped PeerHoldsNewest
PROPERTIES RowsImmutable PruneOnlySent
