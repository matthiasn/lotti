\* Three versions of one entity enqueued by concurrent callers in any
\* order, bundles of two, failed sends, a mark that throws and a crash. The
\* keyed lock, newest-wins merge and older-only enrichment keep every counter
\* in a row that sends the newest payload. Arrival order is the callers' own,
\* so NewestLandsLast is not claimed here.
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    SimpleMsgs = {}
    MaxVersion = 3
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 1
    Faults = {"sendFail", "markFail"}
    InOrderEnqueue = FALSE
    UserActions = FALSE
    KeyedEnqueueLock = TRUE
    NewestPayloadWins = TRUE
    CoverOnlyOlder = TRUE
    ReleaseBeforeDrain = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered
PROPERTIES MergeNeverRegresses PruneOnlySent EveryRowSettles EnqueuedIsDelivered
