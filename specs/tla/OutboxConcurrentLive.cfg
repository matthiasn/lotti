\* OutboxConcurrent with two versions, so liveness can be checked too: two
\* versions of one entity enqueued in any order, the first owing the
\* attachment; bundles of two, failed sends, a mark that throws and a crash
\* or teardown. Every row settles and every version reaches the room.
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    SimpleMsgs = {}
    MaxVersion = 2
    MediaVersions = {1}
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 1
    Faults = {"sendFail", "markFail"}
    InOrderEnqueue = FALSE
    UserActions = FALSE
    UserRemoves = FALSE
    NewestByClock = TRUE
    CoverCollapsed = TRUE
    CarryMedia = TRUE
    AbsorbErrorRows = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered MediaNotDropped
PROPERTIES RowsImmutable PruneOnlySent EveryRowSettles EnqueuedIsDelivered
