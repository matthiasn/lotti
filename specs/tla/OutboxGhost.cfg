\* In-order writes with timed-out sends that land late, a failed send, a
\* crash or teardown, and the monitor's Retry and Remove. Nothing enqueued
\* is lost and every attachment reaches the room. A late landing can put an
\* older payload last, so NewestLandsLast is not claimed (ADR 0085's
\* residual); the stamped receiver still ends on the newest version, so
\* PeerHoldsNewest is (ADR 0094).
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    RowKeys = {}
    SimpleMsgs = {}
    MaxVersion = 2
    MediaVersions = {1}
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 2
    Faults = {"sendFail", "ghost", "markFail"}
    InOrderEnqueue = TRUE
    UserActions = TRUE
    UserRemoves = TRUE
    NewestByClock = TRUE
    CoverCollapsed = TRUE
    CarryMedia = TRUE
    AbsorbErrorRows = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
    StampedReceiver = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered MediaNotDropped PeerHoldsNewest
PROPERTIES RowsImmutable PruneOnlySent EveryRowSettles EnqueuedIsDelivered
