\* In-order writes with timed-out sends that land late, a failed send, a
\* crash or teardown, and the monitor's Retry and Remove. Nothing enqueued
\* is lost and every attachment reaches the room. A late landing can put an
\* older payload last, so NewestLandsLast is not claimed (residual of ADR
\* 0085, kept by ADR 0086).
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    SimpleMsgs = {}
    MaxVersion = 2
    MediaVersions = {1}
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 2
    Faults = {"sendFail", "ghost", "markFail"}
    InOrderEnqueue = TRUE
    UserActions = TRUE
    UserRemoves = TRUE
    NewestByClock = TRUE
    CoverCollapsed = TRUE
    CarryMedia = TRUE
    AbsorbErrorRows = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered MediaNotDropped
PROPERTIES RowsImmutable PruneOnlySent EveryRowSettles EnqueuedIsDelivered
