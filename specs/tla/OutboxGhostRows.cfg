\* OutboxGhost for a key whose rows never collapse, an AI configuration:
\* every version is its own send. Timed-out sends that land late, a failed
\* send, a crash or teardown, and the monitor's Retry and Remove. The
\* stamped receiver ends on the newest version however late an older send
\* lands (ADR 0094).
SPECIFICATION Spec
CONSTANTS
    Keys = {a}
    RowKeys = {a}
    SimpleMsgs = {}
    MaxVersion = 2
    MediaVersions = {}
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 2
    Faults = {"sendFail", "ghost", "markFail"}
    InOrderEnqueue = TRUE
    UserActions = TRUE
    UserRemoves = TRUE
    NewestByClock = TRUE
    CoverCollapsed = TRUE
    CarryMedia = TRUE
    AbsorbErrorRows = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
    StampedReceiver = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered PeerHoldsNewest
PROPERTIES RowsImmutable PruneOnlySent EveryRowSettles EnqueuedIsDelivered
