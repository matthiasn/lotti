\* In-order writes of an entity without attachments, failed sends, marks
\* that throw, a crash or teardown, and the monitor's Retry. A newer send
\* settles the entity's failed rows, so Retry never sends a superseded
\* value: NewestLandsLast holds (ADR 0086). Remove is left out: removing
\* the newer row and retrying an older one is the user's own reversal.
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    SimpleMsgs = {}
    MaxVersion = 2
    MediaVersions = {}
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 2
    Faults = {"sendFail", "markFail"}
    InOrderEnqueue = TRUE
    UserActions = TRUE
    UserRemoves = FALSE
    NewestByClock = TRUE
    CoverCollapsed = TRUE
    CarryMedia = TRUE
    AbsorbErrorRows = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered NewestLandsLast
PROPERTIES RowsImmutable PruneOnlySent EveryRowSettles EnqueuedIsDelivered
