\* In-order writes with every fault: failed and timed-out sends that land
\* late, marks that throw, a crash, and the monitor's Retry and Remove.
\* Nothing enqueued is lost and only sent rows are pruned. A late landing or
\* a manual retry can put an older payload last in the room, so
\* NewestLandsLast is not claimed (the residuals of ADR 0085).
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    SimpleMsgs = {}
    MaxVersion = 2
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 2
    Faults = {"sendFail", "ghost", "markFail"}
    InOrderEnqueue = TRUE
    UserActions = TRUE
    KeyedEnqueueLock = TRUE
    NewestPayloadWins = TRUE
    CoverOnlyOlder = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered
PROPERTIES MergeNeverRegresses PruneOnlySent EveryRowSettles EnqueuedIsDelivered
