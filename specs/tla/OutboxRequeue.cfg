\* OutboxOperator without the user: rows that run out of retries are given
\* another attempt by a drained queue alone, so no failure is final
\* (FailedIsRetried). RequeueFailed = FALSE leaves a failed row in error
\* for good.
SPECIFICATION Spec
CONSTANTS
    Keys = {k}
    RowKeys = {}
    SimpleMsgs = {}
    MaxVersion = 2
    MediaVersions = {}
    MaxRetries = 2
    MaxBundle = 2
    MaxCrashes = 1
    FaultBudget = 2
    Faults = {"sendFail", "markFail"}
    InOrderEnqueue = TRUE
    UserActions = FALSE
    UserRemoves = FALSE
    NewestByClock = TRUE
    CoverCollapsed = TRUE
    CarryMedia = TRUE
    AbsorbErrorRows = TRUE
    ReleaseBeforeDrain = TRUE
    QuiesceOnDispose = TRUE
    StampedReceiver = TRUE
    RequeueFailed = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostCounter CoversOnlyOlder SentWasDelivered NewestLandsLast PeerHoldsNewest
PROPERTIES RowsImmutable PruneOnlySent EveryRowSettles EnqueuedIsDelivered FailedIsRetried
