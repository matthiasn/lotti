\* Two connected devices, two hourly slots, a change on either device at any
\* moment before the second slot. Received state is applied promptly; the
\* slow-backlog case is ProjectWakeGovernorBacklog. The budget covers every
\* slot, so nothing is refused. Safety and liveness.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Interval = 3
    Slots = 2
    MaxTime = 16
    MaxDelay = 1
    MaxApplyLag = 1
    Settle = 3
    Lease = 5
    RunCap = 2
    Budget = 3
    EditsBy = 4
    MaxEdits = 2
    MaxManual = 0
    MaxFailures = 0
    MaxOffline = 0
    AllowPause = FALSE
    SyncedSlots = TRUE
    InboxGate = TRUE
    ConnectedClaims = TRUE
    EarliestSlot = TRUE
    SkipWhenFresh = TRUE
    BudgetCheck = TRUE
    HaltOnPause = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateScheduledWake WakeBudgetRespected SharedBudget
           StaleDoesNotTriggerWork NoWorkWhenFresh PausedRunsNothing
PROPERTIES NoLostUpdate
