\* One device drops offline and comes back to a backlog it applies more
\* slowly than the settle — the case the inbox gate exists for. Across a
\* partition the guarantee is NoDuplicateUnlessWriteDropped. Safety.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Interval = 3
    Slots = 2
    MaxTime = 14
    MaxDelay = 1
    MaxApplyLag = 4
    Settle = 3
    Lease = 5
    RunCap = 2
    Budget = 3
    EditsBy = 4
    MaxEdits = 1
    MaxManual = 0
    MaxFailures = 0
    MaxOffline = 1
    AllowPause = FALSE
    SyncedSlots = TRUE
    InboxGate = TRUE
    ConnectedClaims = TRUE
    EarliestSlot = TRUE
    SkipWhenFresh = TRUE
    BudgetCheck = TRUE
    HaltOnPause = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateUnlessWriteDropped WakeBudgetRespected
           StaleDoesNotTriggerWork NoWorkWhenFresh
