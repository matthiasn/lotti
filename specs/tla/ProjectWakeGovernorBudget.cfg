\* A budget of one against three slots, with a manual update and a failed
\* run on two connected devices: automatic work stops at the shared budget,
\* a user's update runs past it, and a failure still counts. Safety.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Interval = 3
    Slots = 3
    MaxTime = 14
    MaxDelay = 1
    MaxApplyLag = 1
    Settle = 3
    Lease = 5
    RunCap = 2
    Budget = 1
    EditsBy = 7
    MaxEdits = 2
    MaxManual = 1
    MaxFailures = 1
    MaxOffline = 0
    AllowPause = FALSE
    SyncedSlots = TRUE
    InboxGate = TRUE
    ConnectedClaims = TRUE
    EarliestSlot = TRUE
    SkipWhenFresh = TRUE
    BudgetCheck = TRUE
    HaltOnPause = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateScheduledWake WakeBudgetRespected SharedBudget
           StaleDoesNotTriggerWork NoWorkWhenFresh
