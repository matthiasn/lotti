\* Pausing the agent on either device while slot runs and a user's update
\* are under way: nothing keeps running once its device knows. Safety.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Interval = 3
    Slots = 2
    MaxTime = 12
    MaxDelay = 1
    MaxApplyLag = 1
    Settle = 3
    Lease = 5
    RunCap = 3
    Budget = 3
    EditsBy = 4
    MaxEdits = 1
    MaxManual = 1
    MaxFailures = 0
    MaxOffline = 0
    AllowPause = TRUE
    SyncedSlots = TRUE
    InboxGate = TRUE
    ConnectedClaims = TRUE
    EarliestSlot = TRUE
    SkipWhenFresh = TRUE
    BudgetCheck = TRUE
    HaltOnPause = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateScheduledWake WakeBudgetRespected
           StaleDoesNotTriggerWork NoWorkWhenFresh PausedRunsNothing
