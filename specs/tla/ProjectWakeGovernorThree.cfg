\* Three connected devices — a desktop, a laptop and a phone — two hourly
\* slots, changes on any of them. One slot, one run, one shared budget.
\* Safety.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Interval = 3
    Slots = 2
    MaxTime = 16
    MaxDelay = 1
    MaxApplyLag = 1
    Settle = 3
    Lease = 5
    RunCap = 2
    Budget = 3
    EditsBy = 4
    MaxEdits = 2
    MaxManual = 0
    MaxFailures = 0
    MaxOffline = 0
    AllowPause = FALSE
    SyncedSlots = TRUE
    InboxGate = TRUE
    ConnectedClaims = TRUE
    EarliestSlot = TRUE
    SkipWhenFresh = TRUE
    BudgetCheck = TRUE
    HaltOnPause = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDuplicateScheduledWake WakeBudgetRespected SharedBudget
           StaleDoesNotTriggerWork NoWorkWhenFresh
