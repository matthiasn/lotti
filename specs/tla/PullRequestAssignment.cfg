\* One device, two pickers or pastes racing on two tasks for two pull
\* requests, with unlinks and the "link here too" question: the link's own
\* re-checks and lock keep every double assignment on one device confirmed,
\* and no task ever holds a pull request twice.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1}
    SessionsPerDevice = 2
    PullRequests = {p1, p2}
    Tasks = {t1, t2}
    MaxLinks = 3
    MaxUnlinks = 1
    PickerFilters = TRUE
    RecheckAtLink = TRUE
    AtomicLink = TRUE
    ConfirmElsewhere = TRUE
    RecheckAtConfirm = TRUE
    KeepIncomingConflict = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoSameTaskDuplicate NoUnconfirmedLocalDoubleAssignment DoubleAssignmentOnlyAcrossDevicesOrConfirmed Converged
