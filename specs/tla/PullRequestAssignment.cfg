\* One device, two pickers or pastes racing on two tasks for two pull
\* requests, with unlinks: the link's own re-check and lock are what keep a
\* pull request to one task.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1}
    SessionsPerDevice = 2
    PullRequests = {p1, p2}
    Tasks = {t1, t2}
    MaxLinks = 3
    MaxUnlinks = 1
    PickerFilters = TRUE
    RecheckAtLink = TRUE
    AtomicLink = TRUE
    KeepIncomingConflict = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLocalDoubleAssignment DoubleAssignmentOnlyAcrossDevices Converged
