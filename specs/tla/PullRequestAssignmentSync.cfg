\* Two devices, one picker or paste each, linking one pull request to two
\* tasks before they sync, confirming or not, then unlinking: an unconfirmed
\* double assignment can arise only here, and every device must end up
\* holding the same entries.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    SessionsPerDevice = 1
    PullRequests = {p1}
    Tasks = {t1, t2}
    MaxLinks = 3
    MaxUnlinks = 2
    PickerFilters = TRUE
    RecheckAtLink = TRUE
    AtomicLink = TRUE
    ConfirmElsewhere = TRUE
    RecheckAtConfirm = TRUE
    KeepIncomingConflict = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoSameTaskDuplicate NoUnconfirmedLocalDoubleAssignment DoubleAssignmentOnlyAcrossDevicesOrConfirmed Converged
