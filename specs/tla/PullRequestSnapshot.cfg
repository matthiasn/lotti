\* One device, a context and a manual refresh racing each other, failing
\* reads, an unlink, and a pull request that is pushed, closed, reopened or
\* merged while they run. Stamps have the resolution of the clock.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1}
    Linker = d1
    TokenDevices = {d1}
    JobKinds = {"context", "manual"}
    MaxTime = 4
    MaxRev = 1
    Res = 1
    MaxUnlinks = 1
    RestampAfter = 2
    FetchCanFail = TRUE
    StampAtRead = TRUE
    GuardNewer = TRUE
    GuardDeleted = TRUE
    MergedFirst = TRUE
    ResolveConcurrent = TRUE
    SuggestRequiresRefresh = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SnapshotHonest ContextHonest SuggestionsFromRefreshed NewerClockNeverOlderData Converged
PROPERTIES NoRegression UnlinkIsFinal
