\* Server stamps with half the resolution of the clock: two reads in the same
\* second can see different states, so the tie-break decides, and the digest
\* is deliberately against recency.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1}
    Linker = d1
    TokenDevices = {d1}
    JobKinds = {"context", "manual"}
    MaxTime = 5
    MaxRev = 1
    Res = 2
    MaxUnlinks = 1
    RestampAfter = 2
    FetchCanFail = TRUE
    StampAtRead = TRUE
    GuardNewer = TRUE
    GuardDeleted = TRUE
    MergedFirst = TRUE
    ResolveConcurrent = TRUE
    SuggestRequiresRefresh = TRUE
    PreferOwnRead = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SnapshotHonest ContextHonest SuggestionsFromRefreshed NewerClockNeverOlderData Converged
PROPERTIES NoRegression UnlinkIsFinal
