\* Every requested refresh ends and replication settles, with two replicas
\* that both refresh and either of which may unlink.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    Linker = d1
    TokenDevices = {d1, d2}
    JobKinds = {"context"}
    MaxTime = 2
    MaxRev = 1
    Res = 1
    MaxUnlinks = 1
    RestampAfter = 2
    FetchCanFail = TRUE
    StampAtRead = TRUE
    GuardNewer = TRUE
    GuardDeleted = TRUE
    MergedFirst = TRUE
    ResolveConcurrent = TRUE
    SuggestRequiresRefresh = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK
PROPERTIES RefreshesEnd SyncSettles
