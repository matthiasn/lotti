\* The second device holds no GitHub token: its contexts never refresh, so
\* they must label the synced snapshot stale and suggest nothing.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    Linker = d1
    TokenDevices = {d1}
    JobKinds = {"context"}
    MaxTime = 3
    MaxRev = 1
    Res = 1
    MaxUnlinks = 1
    RestampAfter = 2
    FetchCanFail = TRUE
    StampAtRead = TRUE
    GuardNewer = TRUE
    GuardDeleted = TRUE
    MergedFirst = TRUE
    ResolveConcurrent = TRUE
    SuggestRequiresRefresh = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SnapshotHonest ContextHonest SuggestionsFromRefreshed NewerClockNeverOlderData Converged
PROPERTIES NoRegression UnlinkIsFinal
