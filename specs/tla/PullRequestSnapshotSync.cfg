\* Two replicas, each building a context while the other refreshes: their
\* versions cross in sync, the concurrent ones go to the resolver, and an
\* unlink on either device races both refreshes.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    Linker = d1
    TokenDevices = {d1, d2}
    JobKinds = {"context"}
    MaxTime = 3
    MaxRev = 1
    Res = 1
    MaxUnlinks = 1
    RestampAfter = 2
    FetchCanFail = TRUE
    StampAtRead = TRUE
    GuardNewer = TRUE
    GuardDeleted = TRUE
    MergedFirst = TRUE
    ResolveConcurrent = TRUE
    SuggestRequiresRefresh = TRUE
    PreferOwnRead = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK SnapshotHonest ContextHonest SuggestionsFromRefreshed NewerClockNeverOlderData Converged
PROPERTIES NoRegression UnlinkIsFinal
