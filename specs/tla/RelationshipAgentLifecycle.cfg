\* Two devices. The person is created on the first and reaches the second
\* late; either can mark, unmark, edit or delete it (from the person page or
\* the journal), and every message arrives in any order.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxPersonWrites = 3
    MaxAgentWrites = 3
    MaxCrashes = 0
    MaxStops = 0
    Conflicts = FALSE
    Pauses = FALSE
    HardDeletes = FALSE
    ReapNeedsTombstone = TRUE
    Reconcile = TRUE
    FieldMerge = TRUE
    HardDeleteStops = TRUE
    CreateHonorsDeleted = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoReapOfLivePerson Tracked Untracked StopSticks Converged
