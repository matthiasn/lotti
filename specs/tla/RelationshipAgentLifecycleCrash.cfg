\* The base configuration where one process dies with its unawaited jobs
\* (the ensure after a mark or save, the teardown after a delete) not run.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxPersonWrites = 3
    MaxAgentWrites = 3
    MaxCrashes = 1
    MaxStops = 0
    Conflicts = FALSE
    Pauses = FALSE
    HardDeletes = FALSE
    ReapNeedsTombstone = TRUE
    Reconcile = TRUE
    FieldMerge = TRUE
    HardDeleteStops = TRUE
    CreateHonorsDeleted = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoReapOfLivePerson Tracked Untracked StopSticks Converged
