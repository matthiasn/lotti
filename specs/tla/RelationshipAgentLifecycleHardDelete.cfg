\* The stop configuration where the user may also hard-delete a destroyed
\* agent, which is a stop too.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxPersonWrites = 4
    MaxAgentWrites = 4
    MaxCrashes = 0
    MaxStops = 1
    Conflicts = FALSE
    Pauses = FALSE
    HardDeletes = TRUE
    ReapNeedsTombstone = TRUE
    Reconcile = TRUE
    FieldMerge = TRUE
    HardDeleteStops = TRUE
    CreateHonorsDeleted = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoReapOfLivePerson Tracked Untracked StopSticks Converged
