\* Three timers over six moments, autosaved every two, one crash: every
\* interleaving of the user's starts and stops, the agent's start, a quit
\* and a crash with the clock and the autosave.
SPECIFICATION Spec
CONSTANTS
    Entries = {e1, e2, e3}
    MaxTime = 6
    Interval = 2
    MaxCrashes = 1
    StopPersists = TRUE
    ShutdownPersists = TRUE
    AgentStartAtomic = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostTime CrashLossBounded NoStolenTimer
