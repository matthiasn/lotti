\* Two devices, two goal escalations (the second re-armed over the consumed
\* first), one device may die. The settle exceeds twice the sync delay, as
\* three minutes exceed it. Safety and liveness.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxArms = 2
    ArmBy = 4
    Settle = 3
    Lease = 5
    MaxDelay = 1
    MaxDown = 6
    MaxTime = 14
    MaxCrashes = 0
    MaxDeaths = 1
    ArmMode = "carry"
    FlushBeforeConsume = TRUE
    OwedCheck = TRUE
    ConsumeCurrentRow = TRUE
    RunOutlastsConsume = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOnce NoDeviceRunsTwice WindowTerminal Converged
PROPERTIES NoLostWindow
