\* Two devices, one escalation, one crash at any point, with a downtime that
\* may outlast the lease. A device back from a crash acts on its replica
\* before sync catches up, like a partitioned one, so this checks that no
\* device runs the window twice rather than AtMostOnce.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxArms = 1
    ArmBy = 2
    Settle = 3
    Lease = 5
    MaxDelay = 1
    MaxDown = 5
    MaxTime = 15
    MaxCrashes = 1
    MaxDeaths = 0
    ArmMode = "carry"
    FlushBeforeConsume = TRUE
    OwedCheck = TRUE
    ConsumeCurrentRow = TRUE
    RunOutlastsConsume = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDeviceRunsTwice WindowTerminal Converged
PROPERTIES NoLostWindow
