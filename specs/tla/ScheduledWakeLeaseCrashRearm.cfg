\* Two devices, two goal escalations — the second re-armed over the
\* consumed first — and one crash at any point. A device back from a crash
\* acts on its stale replica before sync catches up, which is how a late
\* claim of the first window meets the second. Safety only.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxArms = 2
    ArmBy = 4
    Settle = 3
    Lease = 5
    MaxDelay = 1
    MaxDown = 5
    MaxTime = 14
    MaxCrashes = 1
    MaxDeaths = 0
    ArmMode = "carry"
    FlushBeforeConsume = TRUE
    OwedCheck = TRUE
    ConsumeCurrentRow = TRUE
    RunOutlastsConsume = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoDeviceRunsTwice WindowTerminal Converged
