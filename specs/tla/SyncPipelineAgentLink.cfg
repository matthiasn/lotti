SPECIFICATION Spec
CONSTANTS
    Family = "agentLink"
    Peers = {peer}
    MaxCounter = 1
    SeparateEntities = FALSE
    ConcurrentWriters = FALSE
    AbortCounters = {}
    MaxFaults = 1
    MaxCrashes = 0
    FaultKinds = {"stage", "send", "apply"}
    DurableBurn = TRUE
    BindAfterEnqueue = TRUE
    ReceiptAfterApply = TRUE
    VerifyHints = TRUE
    PrepareExactPayload = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoFalseBurn BurnHasDurableMarker BoundHasDurablePayload StagedHasDurablePayload NoFalseReceipt CausalCoverage NoContentlessState AcknowledgedPayload SettledPeersAgree
PROPERTIES VisibleGapHeals CommittedReachesRoom CommittedReachesPeer VisiblePayloadsConverge BurnReachesPeer
