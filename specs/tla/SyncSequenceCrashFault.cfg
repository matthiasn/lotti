\* One originator crash at any point plus any one injected fault. Safety
\* only: a swallowed enqueue failure or an abandoned event is not retried.
\* This is the configuration that used to fail NoFalseBurn when the
\* reserved-row insert failed and the process then crashed.
SPECIFICATION Spec
CONSTANTS
    Peers = {p1}
    Entities = {e1, e2}
    MaxCounter = 3
    MaxCrashes = 1
    FaultBudget = 1
    Faults = {"rowWrite", "fallbackWrite", "bind", "throwAfterCommit",
              "enqueue", "broadcast", "loss"}
    IntentChoices = {TRUE}
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoFalseBurn ReceivedIsReal BoundRowsHavePayload
PROPERTIES BurnedIsTerminal
