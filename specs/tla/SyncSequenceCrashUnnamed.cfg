\* One originator crash, and callers may reserve without naming the payload.
\* Safety only: a crash can strand an unnamed reservation, so a request for
\* it stays deferred until the peer gives up. Nothing is ever falsely burned.
SPECIFICATION Spec
CONSTANTS
    Peers = {p1}
    Entities = {e1, e2}
    MaxCounter = 3
    MaxCrashes = 1
    FaultBudget = 0
    Faults = {}
    IntentChoices = {TRUE, FALSE}
    MisnamedReservations = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoFalseBurn ReceivedIsReal BoundRowsHavePayload
PROPERTIES BurnedIsTerminal
