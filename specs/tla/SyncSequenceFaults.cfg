\* Any two injected faults, no crash. Safety only: a swallowed enqueue
\* failure or an abandoned event is not retried, so delivery is not claimed.
SPECIFICATION Spec
CONSTANTS
    Peers = {p1}
    Entities = {e1, e2}
    MaxCounter = 3
    MaxCrashes = 0
    FaultBudget = 2
    Faults = {"rowWrite", "bind", "throwAfterCommit", "enqueue", "broadcast",
              "loss"}
    IntentChoices = {TRUE}
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoFalseBurn ReceivedIsReal BoundRowsHavePayload
PROPERTIES BurnedIsTerminal
