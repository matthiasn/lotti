\* Two devices, three agent ids: each device auto-assigns the follow-up once,
\* either can assign by hand, the user destroys once and deletes, and one
\* process dies between a receive and its pass. Every arrival order.
SPECIFICATION Spec
CONSTANTS
    Devices = {A, B}
    Agents = {a1, a2, a3}
    LegacyAgents = {a1, a2}
    MaxDestroys = 1
    MaxCrashes = 1
    Legacy = FALSE
    Skew = FALSE
    RetireLosers = TRUE
    RetireOnReceive = TRUE
    StartupRetire = TRUE
    WakeGate = TRUE
    SharedRank = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOneLive LiveAgreed KeepsAgent KeepsAgentUndestroyed NoSupersededWake
