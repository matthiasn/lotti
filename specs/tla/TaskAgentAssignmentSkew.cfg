\* The base configuration with device clocks that disagree: a new agent can
\* rank anywhere among the task's agents. KeepsAgent does not hold here (see
\* the README); without a user destroy some agent always stays.
SPECIFICATION Spec
CONSTANTS
    Devices = {A, B}
    Agents = {a1, a2, a3}
    LegacyAgents = {a1, a2}
    MaxDestroys = 1
    MaxCrashes = 0
    Legacy = FALSE
    Skew = TRUE
    RetireLosers = TRUE
    RetireOnReceive = TRUE
    StartupRetire = TRUE
    WakeGate = TRUE
    SharedRank = TRUE
    EarlyHardDelete = TRUE
    DeletedTombstone = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOneLive LiveAgreed KeepsAgentUndestroyed NoSupersededWake DeletedStaysDeleted
