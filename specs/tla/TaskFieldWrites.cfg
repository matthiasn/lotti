\* Two devices, the agent on one of them, two fields — the status and one
\* plain field — and three writes: every interleaving of the copies the
\* writers read, the versions sync lands, and one conflict resolved.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    AgentDevices = {d1}
    Fields = {"status", "priority"}
    Vals = {1, 2}
    MaxWrites = 3
    MaxResolves = 1
    UiOnStored = TRUE
    AgentOnStored = TRUE
    AgentCas = TRUE
    UiRecordsStatus = TRUE
    ResolveJoinsHistory = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostFieldEdit HistoryComplete NoBlindAgentWrite Converged
