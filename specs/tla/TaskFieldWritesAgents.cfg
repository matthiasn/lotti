\* The task agent writing on both devices: two agents' copies, each set
\* over what the other device's agent and user wrote.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    AgentDevices = {d1, d2}
    Fields = {"status", "priority"}
    Vals = {1, 2}
    MaxWrites = 3
    MaxResolves = 1
    UiOnStored = TRUE
    AgentOnStored = TRUE
    AgentCas = TRUE
    UiRecordsStatus = TRUE
    ResolveJoinsHistory = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostFieldEdit HistoryComplete NoBlindAgentWrite Converged
