\* The writers that hold a copy for longer than a field write: a metadata
\* write (a toggle, a category or date change, the geolocation, the agent's
\* labels) on the device the agent writes on, and a conflict screen that
\* resolves against the side it read when it opened.
SPECIFICATION Spec
CONSTANTS
    Devices = {d1, d2}
    AgentDevices = {d1}
    Fields = {"status", "priority"}
    Vals = {1, 2}
    MaxWrites = 3
    MaxResolves = 1
    UiOnStored = TRUE
    AgentOnStored = TRUE
    AgentCas = TRUE
    UiRecordsStatus = TRUE
    ResolveJoinsHistory = TRUE
    ShownFields = {"status", "priority"}
    MetaDevices = {d1}
    MetaOnStored = TRUE
    StalePages = TRUE
    ResolveOnStored = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostFieldEdit HistoryComplete NoBlindAgentWrite NoSilentFieldLoss Converged
