\* One task filed, moved and unfiled among two projects on two devices,
\* with a wall clock that skews, every version delivered in any order,
\* repeatedly.
SPECIFICATION Spec
CONSTANTS
    ND = 2
    NT = 1
    NP = 3
    MaxWrites = 4
    MaxTime = 1
    Skew = 1
    HopCap = 1
    AtomicCheck = TRUE
    Uncapped = TRUE
    DetectCycle = TRUE
    RetireAll = TRUE
    ReleaseByStatus = TRUE
    DeterministicWinner = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK AtMostOneProject ProjectWriteSticks FilingShows
