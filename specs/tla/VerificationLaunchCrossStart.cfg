\* Two active devices, two launchers each, that may start the ceremony at
\* each other, with patient users who confirm and never cancel or abandon a
\* sheet, and nobody tapping "Show the emoji". The automatic flow has to
\* finish on its own: AutoVerifies.
SPECIFICATION Spec
CONSTANTS
    Devices = {1, 2}
    Active = {1, 2}
    Launchers = {1, 2}
    MaxRelaunch = 0
    Cooperative = TRUE
    DeferIncoming = TRUE
    GlareHandoff = TRUE
    CancelOnDismiss = TRUE
    PreferLastShown = TRUE
    RecordOnlyShown = TRUE
    SharedHandled = TRUE
    ReleaseOne = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK LockMatchesSheet VerifiedByCeremony HandledWasShown NoReoffer RelaunchHonoured
PROPERTIES EventuallyOffered AutoVerifies
